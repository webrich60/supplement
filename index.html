<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>毎日のサプリ＆おくすり管理</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes fadeInDown {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .animate-fade-in-down {
      animation: fadeInDown 0.3s ease-out forwards;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-900 pb-28 pt-20 select-none">

  <!-- ヘッダー -->
  <header class="bg-gradient-to-r from-teal-700 via-teal-800 to-emerald-800 text-white p-4 shadow-lg fixed top-0 left-0 w-full z-30 flex items-center justify-between border-b-4 border-teal-900 px-4">
    <div class="flex items-center">
      <i data-lucide="calendar-check-2" class="mr-2.5 h-7 w-7 text-yellow-300 drop-shadow-md"></i>
      <h1 class="text-lg md:text-xl font-black tracking-wide">毎日のサプリ＆おくすり管理</h1>
    </div>
    <div onclick="goToToday()" class="bg-teal-900/70 hover:bg-teal-950 px-3 py-1 rounded-lg text-xs font-black cursor-pointer border border-teal-600 transition">
      今日へ
    </div>
  </header>

  <!-- メインコンテンツ領域 -->
  <main class="max-w-3xl mx-auto p-4" id="main-content"></main>

  <!-- トースト通知 -->
  <div id="toast" class="hidden fixed top-24 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl z-50 border-2 border-teal-400 font-black animate-fade-in-down whitespace-nowrap text-sm flex items-center gap-2">
    <i data-lucide="info" class="w-4 h-4 text-teal-400"></i>
    <span id="toast-msg"></span>
  </div>

  <!-- 下部ナビゲーション -->
  <nav class="fixed bottom-0 w-full bg-white border-t-2 border-slate-300 flex justify-around p-2 z-40 shadow-[0_-5px_20px_rgba(0,0,0,0.06)] pb-safe">
    <button onclick="switchTab('log')" id="nav-log" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-400">
      <i data-lucide="calendar-days" class="w-6 h-6 mb-1"></i>
      <span class="text-[10px] font-black uppercase tracking-tighter">記録</span>
    </button>
    <button onclick="switchTab('manage')" id="nav-manage" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-400">
      <i data-lucide="pill" class="w-6 h-6 mb-1"></i>
      <span class="text-[10px] font-black uppercase tracking-tighter">サプリ管理</span>
    </button>
    <button onclick="switchTab('history')" id="nav-history" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-400">
      <i data-lucide="clipboard-list" class="w-6 h-6 mb-1"></i>
      <span class="text-[10px] font-black uppercase tracking-tighter">既往歴</span>
    </button>
    <button onclick="switchTab('ai')" id="nav-ai" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-400">
      <i data-lucide="bot-message-square" class="w-6 h-6 mb-1"></i>
      <span class="text-[10px] font-black uppercase tracking-tighter">AI相談・分析</span>
    </button>
    <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-400">
      <i data-lucide="settings-2" class="w-6 h-6 mb-1"></i>
      <span class="text-[10px] font-black uppercase tracking-tighter">設定</span>
    </button>
  </nav>

  <script>
    const formatDate = (date) => {
      const d = new Date(date);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().split('T')[0];
    };
    
    function resizeImage(dataUrl, maxWidth = 500, maxHeight = 500) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
        img.src = dataUrl;
      });
    }

    let savedSupps = [];
    try {
      const stored = localStorage.getItem('supplements');
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed)) {
          savedSupps = parsed.map(s => {
            const morning = s.timingSchedule?.morning ?? (s.defaultDosage ? Math.ceil(s.defaultDosage / 2) : 1);
            const afternoon = s.timingSchedule?.afternoon ?? 0;
            const evening = s.timingSchedule?.evening ?? (s.defaultDosage ? Math.floor(s.defaultDosage / 2) : 1);
            return {
              id: s.id || Date.now().toString(),
              name: s.name || 'サプリメント',
              recommendedDosage: Math.round(s.recommendedDosage || (morning + afternoon + evening) || 1),
              timingSchedule: { morning: Math.round(morning), afternoon: Math.round(afternoon), evening: Math.round(evening) },
              image: s.image || null
            };
          });
        }
      }
    } catch (e) {
      console.error("データの読み込みエラー", e);
    }

    if (savedSupps.length === 0) {
      savedSupps = [
        { id: '1', name: 'マルチビタミン', recommendedDosage: 2, timingSchedule: { morning: 1, afternoon: 0, evening: 1 }, image: null },
        { id: '2', name: 'ビタミンC', recommendedDosage: 3, timingSchedule: { morning: 1, afternoon: 1, evening: 1 }, image: null }
      ];
    }

    let migratedLogs = {};
    try {
      const rawLogs = JSON.parse(localStorage.getItem('logs')) || {};
      Object.keys(rawLogs).forEach(dateKey => {
        const dayVal = rawLogs[dateKey];
        if (dayVal && (dayVal.morning || dayVal.afternoon || dayVal.evening)) {
          migratedLogs[dateKey] = dayVal;
        } else if (typeof dayVal === 'object') {
          migratedLogs[dateKey] = { morning: { ...dayVal }, afternoon: {}, evening: {} };
        }
      });
    } catch(e) {
      console.error("ログ読み込みエラー", e);
    }

    const state = {
      activeTab: 'log',
      activeTiming: 'all',
      selectedDate: formatDate(new Date()),
      calendarDate: new Date(),
      supplements: savedSupps,
      logs: migratedLogs,
      medicalHistory: localStorage.getItem('medicalHistory') || '',
      gasUrl: localStorage.getItem('gasUrl') || '',
      manageForm: { name: '', recommendedDosage: '', morning: '1', afternoon: '0', evening: '1' },
      editingSuppId: null,
      newSuppImage: null,
      isAnalyzing: false,
      aiLoading: false,
      aiReport: '',
      aiChatHistory: [],
      aiQuestion: '',
      isAskingAI: false
    };

    function saveData() {
      try {
        localStorage.setItem('supplements', JSON.stringify(state.supplements));
        localStorage.setItem('logs', JSON.stringify(state.logs));
        localStorage.setItem('medicalHistory', state.medicalHistory);
        localStorage.setItem('gasUrl', state.gasUrl);
      } catch (e) {
        try {
          // 容量オーバー回避処理
          const stripped = state.supplements.map(s => ({ ...s, image: null }));
          localStorage.setItem('supplements', JSON.stringify(stripped));
          showToast('容量上限のため画像以外のデータを保存しました');
        } catch (innerErr) {
          showToast('ブラウザのデータ保存容量を超えました');
        }
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = message;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      render();
    }

    function changeMonth(delta) {
      const d = new Date(state.calendarDate);
      d.setMonth(d.getMonth() + delta);
      state.calendarDate = d;
      render();
    }

    function selectDate(dateStr) {
      state.selectedDate = dateStr;
      state.calendarDate = new Date(dateStr);
      render();
    }

    function goToToday() {
      state.selectedDate = formatDate(new Date());
      state.calendarDate = new Date();
      render();
    }

    function setFilterTiming(timing) {
      state.activeTiming = timing;
      render();
    }

    function ensureDayLog(dateStr) {
      if (!state.logs[dateStr]) state.logs[dateStr] = { morning: {}, afternoon: {}, evening: {} };
      if (!state.logs[dateStr].morning) state.logs[dateStr].morning = {};
      if (!state.logs[dateStr].afternoon) state.logs[dateStr].afternoon = {};
      if (!state.logs[dateStr].evening) state.logs[dateStr].evening = {};
    }

    async function handleToggleLog(suppId, timing) {
      ensureDayLog(state.selectedDate);
      const supp = state.supplements.find(s => s.id === suppId);
      if (!supp) return;

      const plannedAmount = supp.timingSchedule[timing] || 0;
      const currentLog = state.logs[state.selectedDate][timing][suppId];
      let newAmount;

      if (currentLog !== undefined && currentLog > 0) {
        delete state.logs[state.selectedDate][timing][suppId];
        newAmount = 0;
        showToast(`「${supp.name}」を未記録に戻しました`);
      } else {
        newAmount = plannedAmount > 0 ? plannedAmount : 1;
        state.logs[state.selectedDate][timing][suppId] = newAmount;
        showToast(`「${supp.name}」を ${newAmount}粒 記録しました`);
      }

      saveData();
      render();

      if (state.gasUrl) {
        try {
          fetch(state.gasUrl.trim().replace(/\/edit.*$/, '/exec'), {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'log', date: state.selectedDate, timing: timing,
              timingLabel: getTimingLabel(timing), suppId: supp.id, suppName: supp.name, amount: newAmount, unit: '粒'
            })
          });
        } catch (e) { console.error('GAS送信失敗:', e); }
      }
    }

    function handleCustomDosageChange(suppId, timing, val) {
      ensureDayLog(state.selectedDate);
      const amount = Math.max(0, Math.round(Number(val) || 0));
      if (amount === 0) delete state.logs[state.selectedDate][timing][suppId];
      else state.logs[state.selectedDate][timing][suppId] = amount;
      saveData();
      render();
    }

    function getTimingLabel(timing) {
      return timing === 'morning' ? '朝' : (timing === 'afternoon' ? '昼' : '夕・夜');
    }

    function handleImageChange(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = async (e) => { 
          try {
            state.newSuppImage = await resizeImage(e.target.result, 500, 500);
            render(); 
          } catch(err) { showToast('画像処理失敗'); }
        };
        reader.readAsDataURL(file);
      }
    }

    async function handleAnalyzeImage() {
      if (!state.gasUrl) return showToast('設定からGAS URLを設定してください');
      if (!state.newSuppImage) return showToast('写真を選択してください');
      
      let targetUrl = state.gasUrl.trim().replace(/\/edit.*$/, '/exec');
      state.isAnalyzing = true;
      render();

      try {
        const match = state.newSuppImage.match(/^data:(image\/[a-zA-Z+]+);base64,(.+)$/);
        if (!match) throw new Error('画像フォーマット不正');
        
        const response = await fetch(targetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'gemini',
            model: 'gemini-3-flash-preview', // 指定されたモデルへ変更
            payload: {
              contents: [{ role: "user", parts: [{ text: "このサプリ・薬のパッケージ画像から「製品名(name)」「1日の合計推奨量(recommendedDosage)」「朝(morning), 昼(afternoon), 夕/夜(evening)ごとの目安粒数」を抽出し、JSON形式で返答してください。単位はすべて整数です。" }, { inlineData: { mimeType: match[1], data: match[2] } }] }],
              generationConfig: { responseMimeType: "application/json" }
            }
          })
        });

        const result = await response.json();
        if (result.status === 'error') throw new Error(result.message);
        
        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
        if (text) {
          const parsed = JSON.parse(text);
          if (parsed.name) state.manageForm.name = parsed.name;
          if (parsed.recommendedDosage) state.manageForm.recommendedDosage = String(Math.round(parsed.recommendedDosage));
          state.manageForm.morning = String(parsed.morning !== undefined ? Math.round(parsed.morning) : 1);
          state.manageForm.afternoon = String(parsed.afternoon !== undefined ? Math.round(parsed.afternoon) : 0);
          state.manageForm.evening = String(parsed.evening !== undefined ? Math.round(parsed.evening) : 1);
          showToast('AIが解析・自動入力しました！');
        }
      } catch (e) {
        showToast('解析失敗: ' + e.message);
      } finally {
        state.isAnalyzing = false;
        render();
      }
    }

    async function handleGenerateAIReport() {
      if (!state.gasUrl) return showToast('設定からGAS URLを設定してください');
      state.aiLoading = true;
      state.aiReport = '';
      render();

      try {
        const parts = [{ 
          text: `あなたはプロのアドバイザーです。以下のデータをもとに週間レビューを作成してください。\n既往歴: ${state.medicalHistory || "なし"}\nサプリ: ${JSON.stringify(state.supplements)}\n最近のログ: ${JSON.stringify(state.logs)}`
        }];

        const response = await fetch(state.gasUrl.trim().replace(/\/edit.*$/, '/exec'), {
          method: 'POST', headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'gemini',
            model: 'gemini-3-flash-preview',
            payload: { contents: [{ role: 'user', parts }] }
          })
        });

        const result = await response.json();
        if (result.status === 'error') throw new Error(result.message);
        state.aiReport = result.candidates?.[0]?.content?.parts?.[0]?.text || '生成失敗';
      } catch (e) {
        state.aiReport = 'エラー: ' + e.message;
      } finally {
        state.aiLoading = false;
        render();
      }
    }

    async function handleAskAI() {
      if (!state.gasUrl) return showToast('設定画面からGAS URLを設定してください');
      if (!state.aiQuestion.trim()) return;

      const question = state.aiQuestion;
      state.aiQuestion = '';
      state.isAskingAI = true;
      state.aiChatHistory.push({ role: 'user', text: question });
      render();

      try {
        const prompt = `あなたはプロのヘルスケアアドバイザーです。既往歴「${state.medicalHistory || "特になし"}」、登録サプリ「${JSON.stringify(state.supplements)}」、服薬ログ「${JSON.stringify(state.logs)}」を踏まえて、次の質問に答えてください。\n\n質問: ${question}`;
        const response = await fetch(state.gasUrl.trim().replace(/\/edit.*$/, '/exec'), {
          method: 'POST', headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'gemini',
            model: 'gemini-3-flash-preview',
            payload: { contents: [{ role: "user", parts: [{ text: prompt }] }] }
          })
        });
        const result = await response.json();
        if (result.status === 'error') throw new Error(result.message);
        const answer = result.candidates?.[0]?.content?.parts?.[0]?.text || '回答エラー';
        state.aiChatHistory.push({ role: 'model', text: answer });
      } catch (e) {
        state.aiChatHistory.push({ role: 'model', text: 'エラーが発生しました: ' + e.message });
      } finally {
        state.isAskingAI = false;
        render();
      }
    }

    function startEdit(id) {
      const supp = state.supplements.find(s => s.id === id);
      if (!supp) return;
      state.manageForm.name = supp.name;
      state.manageForm.recommendedDosage = String(supp.recommendedDosage || 0);
      state.manageForm.morning = String(supp.timingSchedule?.morning ?? 0);
      state.manageForm.afternoon = String(supp.timingSchedule?.afternoon ?? 0);
      state.manageForm.evening = String(supp.timingSchedule?.evening ?? 0);
      state.newSuppImage = supp.image;
      state.editingSuppId = id;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function cancelEdit() {
      state.manageForm = { name: '', recommendedDosage: '', morning: '1', afternoon: '0', evening: '1' };
      state.newSuppImage = null;
      state.editingSuppId = null;
      render();
    }

    function handleSaveSupplement(event) {
      event.preventDefault();
      const { name, recommendedDosage, morning, afternoon, evening } = state.manageForm;
      if (!name) return showToast('サプリ名を入力してください');
      
      const mVal = Math.max(0, Math.round(Number(morning) || 0));
      const aVal = Math.max(0, Math.round(Number(afternoon) || 0));
      const eVal = Math.max(0, Math.round(Number(evening) || 0));
      const sum = mVal + aVal + eVal;
      const recVal = recommendedDosage ? Math.round(Number(recommendedDosage)) : (sum > 0 ? sum : 1);

      const suppData = {
        name,
        recommendedDosage: recVal,
        timingSchedule: { morning: mVal, afternoon: aVal, evening: eVal },
        image: state.newSuppImage
      };

      if (state.editingSuppId) {
        const index = state.supplements.findIndex(s => s.id === state.editingSuppId);
        if (index !== -1) state.supplements[index] = { ...state.supplements[index], ...suppData };
        showToast('情報を更新しました');
      } else {
        state.supplements.push({ id: Date.now().toString(), ...suppData });
        showToast('新しく登録しました');
      }
      cancelEdit();
      saveData();
      render();
    }

    function handleDeleteSupplement(id) {
      state.supplements = state.supplements.filter(s => s.id !== id);
      if (state.editingSuppId === id) cancelEdit();
      saveData();
      render();
      showToast('サプリを削除しました');
    }

    function saveHistory() { saveData(); showToast('既往歴を保存しました'); }
    function saveSettings() { saveData(); showToast('設定を保存しました'); }

    function getDayProgress(dateStr) {
      ensureDayLog(dateStr);
      const dayLogs = state.logs[dateStr];
      const timings = ['morning', 'afternoon', 'evening'];
      let scheduled = 0, completed = 0;
      
      timings.forEach(t => {
        let tScheduled = 0, tLogged = 0;
        state.supplements.forEach(supp => {
          if (supp.timingSchedule[t] > 0) {
            tScheduled++;
            if (dayLogs[t]?.[supp.id] > 0) tLogged++;
          }
        });
        scheduled += tScheduled;
        completed += tLogged;
      });
      return { hasPlan: scheduled > 0, isFullDone: scheduled > 0 && completed >= scheduled };
    }

    function renderCalendarHTML() {
      const year = state.calendarDate.getFullYear();
      const month = state.calendarDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = formatDate(new Date());

      let html = `<div class="bg-white p-4 rounded-2xl shadow-md border-2 border-slate-300 mb-5 relative overflow-hidden">
        <div class="flex justify-between items-center mb-3">
          <button onclick="changeMonth(-1)" class="p-2 bg-slate-100 text-slate-700 rounded-full hover:bg-slate-200"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
          <div class="font-black text-lg text-teal-900">${year}年 ${month + 1}月</div>
          <button onclick="changeMonth(1)" class="p-2 bg-slate-100 text-slate-700 rounded-full hover:bg-slate-200"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-black text-slate-400 mb-1">
          <div class="text-red-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="text-blue-500">土</div>
        </div>
        <div class="grid grid-cols-7 gap-1">`;
        
      for (let i = 0; i < firstDay; i++) html += `<div></div>`;
      for (let i = 1; i <= daysInMonth; i++) {
        const d = new Date(year, month, i);
        const dateStr = formatDate(d);
        const isSelected = dateStr === state.selectedDate;
        const progress = getDayProgress(dateStr);
        
        let mColor = (state.logs[dateStr]?.morning && Object.keys(state.logs[dateStr].morning).length > 0) ? 'bg-amber-400' : 'bg-slate-200';
        let aColor = (state.logs[dateStr]?.afternoon && Object.keys(state.logs[dateStr].afternoon).length > 0) ? 'bg-sky-400' : 'bg-slate-200';
        let eColor = (state.logs[dateStr]?.evening && Object.keys(state.logs[dateStr].evening).length > 0) ? 'bg-indigo-400' : 'bg-slate-200';

        let bgClass = isSelected ? 'bg-teal-700 text-white shadow-md transform scale-105 z-10 font-black ring-2 ring-teal-400' : (dateStr === todayStr ? 'bg-teal-50 text-teal-900 border-2 border-teal-400 font-bold' : 'hover:bg-slate-100 text-slate-700 font-medium');

        html += `<div onclick="selectDate('${dateStr}')" class="flex flex-col items-center justify-center py-1.5 rounded-xl cursor-pointer transition-all ${bgClass}">
          <span class="text-xs leading-none">${i}</span>
          ${progress.hasPlan ? `<div class="flex gap-0.5 justify-center mt-1 h-1.5"><span class="w-1.5 h-1.5 rounded-full ${mColor}"></span><span class="w-1.5 h-1.5 rounded-full ${aColor}"></span><span class="w-1.5 h-1.5 rounded-full ${eColor}"></span></div>` : '<div class="h-1.5 mt-1"></div>'}
        </div>`;
      }
      html += `</div></div>`;
      return html;
    }

    function render() {
      try {
        const mainEl = document.getElementById('main-content');
        let html = '';

        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.classList.remove('text-teal-800', 'font-black');
          btn.classList.add('text-slate-400');
        });
        const activeBtn = document.getElementById(`nav-${state.activeTab}`);
        if(activeBtn) {
          activeBtn.classList.add('text-teal-800', 'font-black');
          activeBtn.classList.remove('text-slate-400');
        }

        if (state.activeTab === 'log') {
          html += renderCalendarHTML();
          ensureDayLog(state.selectedDate);
          
          html += `<div class="mb-4 bg-white p-4 rounded-2xl shadow-sm border-2 border-slate-200">
            <div class="flex justify-between border-b border-slate-100 pb-3 mb-3">
              <h2 class="text-lg font-black text-slate-800">${state.selectedDate}の記録</h2>
              <div class="flex bg-slate-100 p-1 rounded-xl text-xs font-black">
                <button onclick="setFilterTiming('all')" class="px-2.5 py-1 rounded-lg ${state.activeTiming === 'all' ? 'bg-white text-teal-900 shadow-sm' : 'text-slate-500'}">全て</button>
                <button onclick="setFilterTiming('morning')" class="px-2.5 py-1 rounded-lg ${state.activeTiming === 'morning' ? 'bg-white text-amber-900 shadow-sm' : 'text-slate-500'}">朝</button>
                <button onclick="setFilterTiming('afternoon')" class="px-2.5 py-1 rounded-lg ${state.activeTiming === 'afternoon' ? 'bg-white text-sky-900 shadow-sm' : 'text-slate-500'}">昼</button>
                <button onclick="setFilterTiming('evening')" class="px-2.5 py-1 rounded-lg ${state.activeTiming === 'evening' ? 'bg-white text-indigo-900 shadow-sm' : 'text-slate-500'}">夕</button>
              </div>
            </div>`;

          if (state.supplements.length === 0) {
            html += `<div class="text-center py-8 text-slate-500 font-bold text-sm">サプリ管理から追加してください</div></div>`;
          } else {
            const timings = state.activeTiming === 'all' ? ['morning', 'afternoon', 'evening'] : [state.activeTiming];
            timings.forEach(timing => {
              const icon = timing === 'morning' ? 'sun' : (timing === 'afternoon' ? 'sun-medium' : 'moon');
              html += `<div class="mb-5">
                <h3 class="font-black text-slate-800 text-sm mb-2 flex items-center gap-2"><i data-lucide="${icon}" class="w-4 h-4 text-slate-500"></i>${getTimingLabel(timing)}</h3>
                <div class="space-y-2">`;

              state.supplements.forEach(supp => {
                const plannedAmount = supp.timingSchedule[timing] || 0;
                const loggedAmount = state.logs[state.selectedDate]?.[timing]?.[supp.id];
                const isChecked = loggedAmount !== undefined && loggedAmount > 0;
                const displayVal = isChecked ? loggedAmount : (plannedAmount > 0 ? plannedAmount : 1);

                html += `<div class="bg-white p-3 rounded-xl border-2 ${isChecked ? 'border-teal-500 bg-teal-50/50' : 'border-slate-200'} flex items-center justify-between gap-2">
                  <div class="flex items-center gap-3">
                    ${supp.image ? `<img src="${supp.image}" class="w-10 h-10 rounded-lg object-cover" />` : `<div class="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center border"><i data-lucide="pill" class="w-5 h-5 text-slate-400"></i></div>`}
                    <div>
                      <p class="font-black text-sm text-slate-900">${supp.name}</p>
                      <p class="text-[10px] font-bold text-slate-500">目安: ${plannedAmount}粒</p>
                    </div>
                  </div>
                  <div class="flex items-center gap-2">
                    <input type="number" min="0" value="${displayVal}" onchange="handleCustomDosageChange('${supp.id}', '${timing}', this.value)" class="w-12 p-1 text-center font-black bg-slate-50 border rounded-lg outline-none text-sm" />
                    <button onclick="handleToggleLog('${supp.id}', '${timing}')" class="px-3 py-2 rounded-xl font-black text-xs border flex items-center gap-1 shadow-sm ${isChecked ? 'bg-teal-600 text-white' : 'bg-white text-slate-700'}">
                      <i data-lucide="${isChecked ? 'check-circle-2' : 'circle'}" class="w-4 h-4"></i>${isChecked ? '済' : '飲む'}
                    </button>
                  </div>
                </div>`;
              });
              html += `</div></div>`;
            });
            html += `</div>`;
          }

        } else if (state.activeTab === 'manage') {
          html += `<div class="space-y-5">
            <div class="bg-white p-5 rounded-2xl shadow-sm border-2 ${state.editingSuppId ? 'border-blue-400' : 'border-slate-300'}">
              <h2 class="text-base font-black mb-3"><i data-lucide="${state.editingSuppId ? 'edit-3' : 'plus-circle'}" class="inline w-5 h-5 mr-1 ${state.editingSuppId ? 'text-blue-600' : 'text-teal-600'}"></i>${state.editingSuppId ? '編集' : '追加'}</h2>
              <form onsubmit="handleSaveSupplement(event)" class="space-y-4">
                <input type="text" value="${state.manageForm.name}" oninput="state.manageForm.name=this.value" placeholder="サプリ・薬の名前" class="w-full p-3 border-2 rounded-xl font-bold text-sm outline-none" />
                <div class="bg-slate-50 p-3 rounded-xl border">
                  <label class="text-xs font-black block mb-2">いつ何粒飲むか</label>
                  <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white p-2 rounded-lg border text-center"><span class="text-[10px] block text-amber-700">朝</span><input type="number" min="0" value="${state.manageForm.morning}" oninput="state.manageForm.morning=this.value" class="w-full text-center font-black outline-none border-b" /></div>
                    <div class="bg-white p-2 rounded-lg border text-center"><span class="text-[10px] block text-sky-700">昼</span><input type="number" min="0" value="${state.manageForm.afternoon}" oninput="state.manageForm.afternoon=this.value" class="w-full text-center font-black outline-none border-b" /></div>
                    <div class="bg-white p-2 rounded-lg border text-center"><span class="text-[10px] block text-indigo-700">夕</span><input type="number" min="0" value="${state.manageForm.evening}" oninput="state.manageForm.evening=this.value" class="w-full text-center font-black outline-none border-b" /></div>
                  </div>
                </div>
                <div class="bg-slate-50 p-3 rounded-xl border flex flex-col gap-2">
                  <div class="flex items-center gap-3">
                    ${state.newSuppImage ? `<img src="${state.newSuppImage}" class="w-12 h-12 rounded-lg object-cover border-2 shadow-sm" />` : `<div class="w-12 h-12 rounded-lg bg-white flex items-center justify-center border-2 border-dashed"><i data-lucide="camera" class="text-slate-400"></i></div>`}
                    <label class="cursor-pointer bg-white border border-teal-600 text-teal-800 font-black py-2 px-3 rounded-xl text-xs shadow-sm"><input type="file" accept="image/*" onchange="handleImageChange(event)" class="hidden" />写真を選択</label>
                  </div>
                  ${state.newSuppImage ? `<button type="button" onclick="handleAnalyzeImage()" class="bg-indigo-700 text-white font-black py-2 rounded-xl text-xs shadow-sm">${state.isAnalyzing ? '解析中...' : '写真からAI自動入力'}</button>` : ''}
                </div>
                <div class="flex gap-2">
                  <button type="submit" class="flex-1 text-white font-black py-3 rounded-xl text-sm shadow-md ${state.editingSuppId ? 'bg-blue-600' : 'bg-teal-700'}">${state.editingSuppId ? '保存' : '登録'}</button>
                  ${state.editingSuppId ? `<button type="button" onclick="cancelEdit()" class="bg-slate-300 text-slate-700 font-black px-4 py-3 rounded-xl text-sm">中止</button>` : ''}
                </div>
              </form>
            </div>
            
            <div class="space-y-2">
              <h3 class="font-black text-slate-700 text-sm">登録済み (${state.supplements.length}件)</h3>
              ${state.supplements.map(supp => `
                <div class="bg-white p-3 rounded-xl border flex items-center justify-between shadow-sm">
                  <div class="flex items-center gap-3">
                    ${supp.image ? `<img src="${supp.image}" class="w-10 h-10 rounded-lg object-cover border" />` : `<div class="w-10 h-10 bg-slate-100 rounded-lg border flex items-center justify-center"><i data-lucide="pill" class="text-slate-400"></i></div>`}
                    <div>
                      <p class="font-black text-sm">${supp.name}</p>
                      <p class="text-[10px] font-bold text-slate-600">朝${supp.timingSchedule?.morning||0} 昼${supp.timingSchedule?.afternoon||0} 夕${supp.timingSchedule?.evening||0}</p>
                    </div>
                  </div>
                  <div class="flex items-center gap-1">
                    <button onclick="startEdit('${supp.id}')" class="text-blue-600 p-2"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                    <button onclick="handleDeleteSupplement('${supp.id}')" class="text-red-600 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>`;
        } else if (state.activeTab === 'history') {
          html += `<div class="bg-white p-5 rounded-2xl shadow-sm border-2 border-amber-400">
            <h2 class="text-base font-black text-amber-950 mb-2 flex items-center gap-2"><i data-lucide="file-heart" class="text-amber-700"></i>既往歴・体質メモ</h2>
            <textarea oninput="state.medicalHistory=this.value" placeholder="持病やアレルギーなどを入力" class="w-full h-48 p-3 border-2 border-slate-300 rounded-xl font-bold text-sm outline-none focus:border-amber-500">${state.medicalHistory}</textarea>
            <button onclick="saveHistory()" class="w-full mt-3 bg-amber-600 text-white font-black py-3 rounded-xl text-sm shadow-md">保存する</button>
          </div>`;
        } else if (state.activeTab === 'ai') {
          html += `<div class="space-y-5">
            <div class="bg-indigo-900 p-5 rounded-2xl shadow-md text-white border-2 border-indigo-950">
              <h2 class="text-base font-black mb-2 flex items-center gap-2"><i data-lucide="sparkles" class="text-yellow-300"></i>AI 週間分析レポート</h2>
              <button onclick="handleGenerateAIReport()" ${state.aiLoading ? 'disabled' : ''} class="w-full bg-white text-indigo-950 font-black py-3 rounded-xl text-sm shadow-md">${state.aiLoading ? '分析中...' : 'レポート生成'}</button>
            </div>
            ${state.aiReport ? `<div class="bg-white p-4 rounded-2xl border-2 border-indigo-400 font-bold whitespace-pre-wrap shadow-sm text-xs">${state.aiReport}</div>` : ''}

            <div class="bg-white p-4 rounded-2xl shadow-sm border-2 border-indigo-200 flex flex-col h-[400px]">
              <h3 class="font-black text-indigo-950 mb-2 text-sm">ヘルスケアAIチャット</h3>
              <div class="flex-grow overflow-y-auto mb-3 space-y-2 pr-1" id="ai-chat-area">
                ${state.aiChatHistory.map(msg => `
                  <div class="flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-[85%] p-3 rounded-2xl text-xs font-bold shadow-sm ${msg.role === 'user' ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-100 text-slate-800 border rounded-tl-none'}">${msg.text}</div>
                  </div>
                `).join('')}
              </div>
              <div class="flex gap-2 mt-auto">
                <input type="text" value="${state.aiQuestion}" oninput="state.aiQuestion=this.value" onkeydown="if(event.key==='Enter')handleAskAI()" placeholder="質問を入力..." class="flex-grow p-2.5 border-2 rounded-xl font-bold text-xs outline-none" />
                <button onclick="handleAskAI()" ${state.isAskingAI ? 'disabled' : ''} class="bg-indigo-700 text-white px-4 rounded-xl shadow-sm"><i data-lucide="send" class="w-4 h-4"></i></button>
              </div>
            </div>
          </div>`;
        } else if (state.activeTab === 'settings') {
          html += `<div class="bg-white p-5 rounded-2xl shadow-sm border-2 border-slate-300">
            <h2 class="text-base font-black mb-3"><i data-lucide="settings-2" class="inline w-4 h-4 mr-2"></i>外部連携設定</h2>
            <div class="p-3 border bg-teal-50 rounded-xl">
              <label class="font-black block mb-2 text-xs">GAS WebアプリURL</label>
              <input type="text" value="${state.gasUrl}" oninput="state.gasUrl=this.value" class="w-full p-2.5 border-2 border-teal-300 rounded-xl font-bold text-xs outline-none" />
            </div>
            <button onclick="saveSettings()" class="w-full mt-4 bg-slate-800 text-white font-black py-3 rounded-xl text-xs shadow-md">設定を保存する</button>
          </div>`;
        }

        mainEl.innerHTML = html;
        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();

        if (state.activeTab === 'ai') {
          const chatArea = document.getElementById('ai-chat-area');
          if (chatArea) chatArea.scrollTop = chatArea.scrollHeight;
        }
      } catch (error) {
        document.getElementById('main-content').innerHTML = `
          <div class="p-5 text-red-700 bg-red-50 border-2 border-red-300 rounded-xl text-sm font-bold shadow-sm">
            <i data-lucide="alert-triangle" class="w-6 h-6 mb-2"></i>
            画面の描画に失敗しました。<br>エラー詳細: ${error.message}
          </div>`;
        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
        console.error("Render Error:", error);
      }
    }

    document.addEventListener("DOMContentLoaded", () => render());
  </script>
</body>
</html>
