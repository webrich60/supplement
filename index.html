<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>毎日のサプリ＆おくすり管理</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes fadeInDown {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .animate-fade-in-down {
      animation: fadeInDown 0.3s ease-out forwards;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* スクロールバーを隠さず、操作できる状態を保つ */
    :root { color-scheme: light; }
    html { scroll-behavior: smooth; }
    body { -webkit-tap-highlight-color: transparent; }
    button { touch-action: manipulation; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #0d9488; outline-offset: 2px; }
    .calendar-board { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border:2px solid #64748b; border-radius:12px; overflow:hidden; background:#94a3b8; gap:1px; }
    .calendar-weekday { text-align:center; padding:9px 0; font-size:12px; font-weight:900; background:#e2e8f0; color:#334155; }
    .calendar-day { min-height:51px; background:#fff; color:#0f172a; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:5px; font-weight:800; font-size:15px; border:2px solid transparent; cursor:pointer; }
    .calendar-day.is-today { background:#ccfbf1; border-color:#0f766e; }
    .calendar-day.is-selected { background:#115e59; color:#fff; border-color:#042f2e; }
    .calendar-day.is-complete:not(.is-selected) { background:#ecfdf5; }
    .calendar-day:focus-visible { outline:3px solid #0284c7; outline-offset:-3px; }
    .calendar-dot { height:7px; width:7px; border-radius:50%; display:inline-block; }
    .calendar-blank { background:#f1f5f9; min-height:51px; }
    .section-heading { font-size:16px; font-weight:900; color:#0f172a; }
    @media(min-width:640px) { .calendar-day,.calendar-blank { min-height:66px; } }
    @media(max-width:370px) { .calendar-day,.calendar-blank { min-height:45px; } .calendar-day { font-size:13px; } }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-900 pb-28 pt-20 select-none">

  <!-- ヘッダー -->
  <header class="bg-gradient-to-r from-teal-700 via-teal-800 to-emerald-800 text-white p-4 shadow-lg fixed top-0 left-0 w-full z-30 flex items-center justify-between border-b-4 border-teal-900 px-4">
    <div class="flex items-center min-w-0">
      <i data-lucide="calendar-check-2" class="mr-2 h-6 w-6 sm:h-7 sm:w-7 shrink-0 text-yellow-300 drop-shadow-md"></i>
      <h1 class="text-sm sm:text-lg md:text-xl font-black tracking-wide leading-tight">毎日のサプリ＆おくすり管理</h1>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button type="button" onclick="goToToday()" aria-label="今日の記録へ" class="bg-teal-900/70 hover:bg-teal-950 px-2 sm:px-3 py-2 rounded-lg text-xs font-black cursor-pointer border border-teal-500 transition">今日へ</button>
      <button type="button" onclick="switchTab('settings'); window.scrollTo(0,0)" aria-label="設定画面を開く" title="GAS URL・接続設定" class="flex items-center justify-center w-10 h-10 bg-white/15 hover:bg-white/25 rounded-xl border-2 border-teal-300 text-white shadow-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-yellow-300">
        <i data-lucide="settings" class="w-6 h-6"></i>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ領域 -->
  <main class="max-w-3xl mx-auto px-3 sm:px-5 py-4" id="main-content"></main>

  <!-- トースト通知 -->
  <div id="toast" class="hidden fixed top-24 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl z-50 border-2 border-teal-400 font-black animate-fade-in-down whitespace-nowrap text-sm flex items-center gap-2">
    <i data-lucide="info" class="w-4 h-4 text-teal-400"></i>
    <span id="toast-msg"></span>
  </div>

  <!-- 下部ナビゲーション -->
  <nav class="fixed bottom-0 w-full bg-white border-t-2 border-slate-400 flex justify-around p-2 z-40 shadow-[0_-5px_20px_rgba(0,0,0,0.06)] pb-safe">
    <button onclick="switchTab('log')" id="nav-log" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-500">
      <i data-lucide="calendar-days" class="w-6 h-6 mb-1"></i>
      <span class="text-[11px] font-black tracking-tight">記録</span>
    </button>
    <button onclick="switchTab('manage')" id="nav-manage" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-500">
      <i data-lucide="pill" class="w-6 h-6 mb-1"></i>
      <span class="text-[11px] font-black tracking-tight">サプリ管理</span>
    </button>
    <button onclick="switchTab('history')" id="nav-history" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-500">
      <i data-lucide="clipboard-list" class="w-6 h-6 mb-1"></i>
      <span class="text-[11px] font-black tracking-tight">既往歴</span>
    </button>
    <button onclick="switchTab('ai')" id="nav-ai" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-500">
      <i data-lucide="bot-message-square" class="w-6 h-6 mb-1"></i>
      <span class="text-[11px] font-black tracking-tight">AI相談・分析</span>
    </button>
    <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-500">
      <i data-lucide="settings-2" class="w-6 h-6 mb-1"></i>
      <span class="text-[11px] font-black tracking-tight">設定</span>
    </button>
  </nav>

  <script>
    const formatDate = (date) => {
      const d = new Date(date);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().split('T')[0];
    };
    
    function resizeImage(dataUrl, maxWidth = 500, maxHeight = 500) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
        img.src = dataUrl;
      });
    }

    let savedSupps = [];
    try {
      const stored = localStorage.getItem('supplements');
      if (stored) {
        const parsed = JSON.parse(stored);
        if (Array.isArray(parsed)) {
          savedSupps = parsed.map(s => {
            const morning = s.timingSchedule?.morning ?? (s.defaultDosage ? Math.ceil(s.defaultDosage / 2) : 1);
            const afternoon = s.timingSchedule?.afternoon ?? 0;
            const evening = s.timingSchedule?.evening ?? (s.defaultDosage ? Math.floor(s.defaultDosage / 2) : 1);
            return {
              id: s.id || Date.now().toString(),
              name: s.name || 'サプリメント',
              recommendedDosage: Math.round(s.recommendedDosage || (morning + afternoon + evening) || 1),
              timingSchedule: { morning: Math.round(morning), afternoon: Math.round(afternoon), evening: Math.round(evening) },
              image: s.image || null
            };
          });
        }
      }
    } catch (e) {
      console.error("データの読み込みエラー", e);
    }

    if (savedSupps.length === 0) {
      savedSupps = [
        { id: '1', name: 'マルチビタミン', recommendedDosage: 2, timingSchedule: { morning: 1, afternoon: 0, evening: 1 }, image: null },
        { id: '2', name: 'ビタミンC', recommendedDosage: 3, timingSchedule: { morning: 1, afternoon: 1, evening: 1 }, image: null }
      ];
    }

    let migratedLogs = {};
    try {
      const rawLogs = JSON.parse(localStorage.getItem('logs')) || {};
      Object.keys(rawLogs).forEach(dateKey => {
        const dayVal = rawLogs[dateKey];
        if (dayVal && (dayVal.morning || dayVal.afternoon || dayVal.evening)) {
          migratedLogs[dateKey] = dayVal;
        } else if (typeof dayVal === 'object') {
          migratedLogs[dateKey] = { morning: { ...dayVal }, afternoon: {}, evening: {} };
        }
      });
    } catch(e) {
      console.error("ログ読み込みエラー", e);
    }

    const state = {
      activeTab: 'log',
      activeTiming: 'all',
      selectedDate: formatDate(new Date()),
      calendarDate: new Date(),
      supplements: savedSupps,
      logs: migratedLogs,
      medicalHistory: localStorage.getItem('medicalHistory') || '',
      gasUrl: localStorage.getItem('gasUrl') || '',
      manageForm: { name: '', recommendedDosage: '', morning: '1', afternoon: '0', evening: '1' },
      editingSuppId: null,
      newSuppImage: null,
      isAnalyzing: false,
      aiLoading: false,
      aiError: '',
      photoError: '',
      connectionResult: '',
      checkingConnection: false,
      aiReport: '',
      aiChatHistory: [],
      aiQuestion: '',
      isAskingAI: false
    };

    function saveData() {
      try {
        localStorage.setItem('supplements', JSON.stringify(state.supplements));
        localStorage.setItem('logs', JSON.stringify(state.logs));
        localStorage.setItem('medicalHistory', state.medicalHistory);
        localStorage.setItem('gasUrl', state.gasUrl);
      } catch (e) {
        try {
          // 容量オーバー回避処理
          const stripped = state.supplements.map(s => ({ ...s, image: null }));
          localStorage.setItem('supplements', JSON.stringify(stripped));
          showToast('容量上限のため画像以外のデータを保存しました');
        } catch (innerErr) {
          showToast('ブラウザのデータ保存容量を超えました');
        }
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = message;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      render();
    }

    function changeMonth(delta) {
      const d = new Date(state.calendarDate);
      // 31日から月移動しても翌々月へ飛ばないようにする
      state.calendarDate = new Date(d.getFullYear(), d.getMonth() + delta, 1);
      render();
    }

    function selectDate(dateStr) {
      state.selectedDate = dateStr;
      state.calendarDate = new Date(dateStr);
      render();
    }

    function goToToday() {
      state.selectedDate = formatDate(new Date());
      state.calendarDate = new Date();
      render();
    }

    function setFilterTiming(timing) {
      state.activeTiming = timing;
      render();
    }

    function ensureDayLog(dateStr) {
      if (!state.logs[dateStr]) state.logs[dateStr] = { morning: {}, afternoon: {}, evening: {} };
      if (!state.logs[dateStr].morning) state.logs[dateStr].morning = {};
      if (!state.logs[dateStr].afternoon) state.logs[dateStr].afternoon = {};
      if (!state.logs[dateStr].evening) state.logs[dateStr].evening = {};
    }

    async function handleToggleLog(suppId, timing) {
      ensureDayLog(state.selectedDate);
      const supp = state.supplements.find(s => s.id === suppId);
      if (!supp) return;

      const plannedAmount = supp.timingSchedule[timing] || 0;
      const currentLog = state.logs[state.selectedDate][timing][suppId];
      let newAmount;

      if (currentLog !== undefined && currentLog > 0) {
        delete state.logs[state.selectedDate][timing][suppId];
        newAmount = 0;
        showToast(`「${supp.name}」を未記録に戻しました`);
      } else {
        newAmount = plannedAmount > 0 ? plannedAmount : 1;
        state.logs[state.selectedDate][timing][suppId] = newAmount;
        showToast(`「${supp.name}」を ${newAmount}粒 記録しました`);
      }

      saveData();
      render();

      if (state.gasUrl) {
        try {
          fetch(state.gasUrl.trim().replace(/\/edit.*$/, '/exec'), {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'log', date: state.selectedDate, timing: timing,
              timingLabel: getTimingLabel(timing), suppId: supp.id, suppName: supp.name, amount: newAmount, unit: '粒'
            })
          });
        } catch (e) { console.error('GAS送信失敗:', e); }
      }
    }

    function handleCustomDosageChange(suppId, timing, val) {
      ensureDayLog(state.selectedDate);
      const amount = Math.max(0, Math.round(Number(val) || 0));
      if (amount === 0) delete state.logs[state.selectedDate][timing][suppId];
      else state.logs[state.selectedDate][timing][suppId] = amount;
      saveData();
      render();
    }

    function getTimingLabel(timing) {
      return timing === 'morning' ? '朝' : (timing === 'afternoon' ? '昼' : '夕・夜');
    }

    function handleImageChange(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = async (e) => { 
          try {
            state.newSuppImage = await resizeImage(e.target.result, 500, 500);
            render(); 
          } catch(err) { showToast('画像処理失敗'); }
        };
        reader.readAsDataURL(file);
      }
    }

    function safeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function normalizeGasUrl(raw) {
      let url = (raw || '').trim();
      if (/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/edit/.test(url)) url = url.replace(/\/edit.*$/, '/exec');
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[^\s/?]+\/exec(?:\?.*)?$/.test(url)) {
        throw new Error('GAS_URL: GASのWebアプリURLが正しくありません。デプロイ画面の「ウェブアプリ」URL（/execで終わるURL）を設定してください。');
      }
      return url;
    }

    function explainError(error) {
      const msg = error?.message || String(error);
      if (/Failed to fetch|NetworkError|Load failed|fetch failed|CORS/i.test(msg))
        return 'NETWORK: GASへの通信に失敗しました。GASをWebアプリとしてデプロイし、アクセスできるユーザーの設定と/execのURLを確認してください。ブラウザの接続制限でも発生します。詳細: ' + msg;
      return msg;
    }

    async function gasRequest(payload) {
      const url = normalizeGasUrl(state.gasUrl);
      let response;
      try {
        response = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)});
      } catch(error) { throw new Error(explainError(error)); }
      const raw = await response.text();
      if (!response.ok) throw new Error('HTTP_' + response.status + ': GAS応答エラー。アクセス権限・デプロイ設定を確認してください。');
      let result;
      try {result = JSON.parse(raw);} catch(e) {
        throw new Error('GAS_RESPONSE: GASからJSON以外の応答が届きました。ログイン画面・権限エラー・古いデプロイの可能性があります。応答冒頭: ' + raw.replace(/<[^>]*>/g,' ').slice(0,180));
      }
      if (result.status === 'error' || result.error) {
        const problem = result.message || result.error?.message || '不明なAPIエラー';
        throw new Error((result.code || 'GEMINI_ERROR') + ': ' + problem);
      }
      return result;
    }

    function errorPanel(message, heading='AI通信エラー') {
      if (!message) return '';
      return `<div role="alert" class="mt-3 bg-red-50 border-2 border-red-600 text-red-950 p-4 rounded-xl shadow-sm">
        <p class="text-base font-black mb-2">⚠ ${safeHtml(heading)}</p>
        <p class="text-sm font-semibold leading-relaxed whitespace-pre-wrap break-words select-text">${safeHtml(message)}</p>
        <p class="text-xs font-bold mt-2">※ APIキーやパスワードを共有しないでください。</p>
      </div>`;
    }

    async function checkGasConnection() {
      state.checkingConnection = true;
      state.connectionResult = '';
      render();
      try {
        const url = normalizeGasUrl(state.gasUrl);
        const response = await fetch(url, {method:'GET'});
        const body = await response.text();
        if (!response.ok) throw new Error('HTTP_' + response.status + ': Webアプリへのアクセスが拒否されました。');
        if (!body.includes('毎日のサプリ管理GASサーバーは正常に稼働しています')) {
          throw new Error('GAS_RESPONSE: 想定したGASの応答ではありません。ウェブアプリのデプロイ先やアクセス権限を確認してください。');
        }
        state.connectionResult = '接続OK：GASの公開URLへアクセスできました。ただしGemini APIへの接続は別途確認が必要です。';
      } catch(e) {state.connectionResult = explainError(e);}
      finally {state.checkingConnection = false; render();}
    }

    async function handleAnalyzeImage() {
      if (!state.gasUrl) { state.photoError='GAS_URL: 設定画面でGAS WebアプリURLを登録してください。'; render(); return; }
      if (!state.newSuppImage) return showToast('写真を選択してください');
      
      state.photoError = '';
      state.isAnalyzing = true;
      render();

      try {
        const match = state.newSuppImage.match(/^data:(image\/[a-zA-Z+]+);base64,(.+)$/);
        if (!match) throw new Error('画像フォーマット不正');
        
        const result = await gasRequest({
            action: 'gemini', model: 'gemini-3.6-flash',
            payload: {
              contents: [{role:'user', parts:[
                {text:'このサプリ・薬のパッケージ画像から「製品名(name)」「1日の合計推奨量(recommendedDosage)」「朝(morning), 昼(afternoon), 夕/夜(evening)ごとの目安粒数」を抽出し、JSON形式で返答してください。単位はすべて整数です。読み取れない内容は推測せず空にしてください。'},
                {inlineData:{mimeType:match[1], data:match[2]}}
              ]}], generationConfig:{responseMimeType:'application/json'}
            }
        });
        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error('EMPTY_RESPONSE: Geminiから解析結果が返りませんでした。画像内容・API応答を確認してください。');
        if (text) {
          const parsed = JSON.parse(text);
          if (parsed.name) state.manageForm.name = parsed.name;
          if (parsed.recommendedDosage) state.manageForm.recommendedDosage = String(Math.round(parsed.recommendedDosage));
          state.manageForm.morning = String(parsed.morning !== undefined ? Math.round(parsed.morning) : 1);
          state.manageForm.afternoon = String(parsed.afternoon !== undefined ? Math.round(parsed.afternoon) : 0);
          state.manageForm.evening = String(parsed.evening !== undefined ? Math.round(parsed.evening) : 1);
          showToast('AIが解析・自動入力しました！');
        }
      } catch (e) {
        state.photoError = explainError(e);
      } finally {
        state.isAnalyzing = false;
        render();
      }
    }

    async function handleGenerateAIReport() {
      if (!state.gasUrl) return showToast('設定からGAS URLを設定してください');
      state.aiLoading = true;
      state.aiReport = '';
      render();

      try {
        const parts = [{ 
          text: `あなたはプロのアドバイザーです。以下のデータをもとに週間レビューを作成してください。\n既往歴: ${state.medicalHistory || "なし"}\nサプリ: ${JSON.stringify(state.supplements)}\n最近のログ: ${JSON.stringify(state.logs)}`
        }];

        const response = await fetch(state.gasUrl.trim().replace(/\/edit.*$/, '/exec'), {
          method: 'POST', headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'gemini',
            model: 'gemini-3.6-flash',
            payload: { contents: [{ role: 'user', parts }] }
          })
        });

        const raw = await response.text();
        if (!response.ok) throw new Error('HTTP_' + response.status + ': GASのアクセス設定を確認してください。');
        let result;
        try { result = JSON.parse(raw); } catch(e) { throw new Error('GAS_RESPONSE: JSON以外の応答です。アクセス権限かデプロイURLを確認してください。'); }
        if (result.status === 'error') throw new Error(result.message);
        state.aiReport = result.candidates?.[0]?.content?.parts?.[0]?.text || '生成失敗';
      } catch (e) {
        state.aiReport = 'エラー: ' + e.message;
      } finally {
        state.aiLoading = false;
        render();
      }
    }

    async function handleAskAI() {
      if (!state.gasUrl) return showToast('設定画面からGAS URLを設定してください');
      if (!state.aiQuestion.trim()) return;

      const question = state.aiQuestion;
      state.aiQuestion = '';
      state.isAskingAI = true;
      state.aiChatHistory.push({ role: 'user', text: question });
      render();

      try {
        const prompt = `あなたはプロのヘルスケアアドバイザーです。既往歴「${state.medicalHistory || "特になし"}」、登録サプリ「${JSON.stringify(state.supplements)}」、服薬ログ「${JSON.stringify(state.logs)}」を踏まえて、次の質問に答えてください。\n\n質問: ${question}`;
        const response = await fetch(state.gasUrl.trim().replace(/\/edit.*$/, '/exec'), {
          method: 'POST', headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'gemini',
            model: 'gemini-3.6-flash',
            payload: { contents: [{ role: "user", parts: [{ text: prompt }] }] }
          })
        });
        const raw = await response.text();
        if (!response.ok) throw new Error('HTTP_' + response.status + ': GASのアクセス設定を確認してください。');
        let result;
        try { result = JSON.parse(raw); } catch(e) { throw new Error('GAS_RESPONSE: JSON以外の応答です。アクセス権限かデプロイURLを確認してください。'); }
        if (result.status === 'error') throw new Error(result.message);
        const answer = result.candidates?.[0]?.content?.parts?.[0]?.text || '回答エラー';
        state.aiChatHistory.push({ role: 'model', text: answer });
      } catch (e) {
        state.aiChatHistory.push({ role: 'model', text: 'エラーが発生しました: ' + e.message });
      } finally {
        state.isAskingAI = false;
        render();
      }
    }

    function startEdit(id) {
      const supp = state.supplements.find(s => s.id === id);
      if (!supp) return;
      state.manageForm.name = supp.name;
      state.manageForm.recommendedDosage = String(supp.recommendedDosage || 0);
      state.manageForm.morning = String(supp.timingSchedule?.morning ?? 0);
      state.manageForm.afternoon = String(supp.timingSchedule?.afternoon ?? 0);
      state.manageForm.evening = String(supp.timingSchedule?.evening ?? 0);
      state.newSuppImage = supp.image;
      state.editingSuppId = id;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function cancelEdit() {
      state.manageForm = { name: '', recommendedDosage: '', morning: '1', afternoon: '0', evening: '1' };
      state.newSuppImage = null;
      state.editingSuppId = null;
      render();
    }

    function handleSaveSupplement(event) {
      event.preventDefault();
      const { name, recommendedDosage, morning, afternoon, evening } = state.manageForm;
      if (!name) return showToast('サプリ名を入力してください');
      
      const mVal = Math.max(0, Math.round(Number(morning) || 0));
      const aVal = Math.max(0, Math.round(Number(afternoon) || 0));
      const eVal = Math.max(0, Math.round(Number(evening) || 0));
      const sum = mVal + aVal + eVal;
      const recVal = recommendedDosage ? Math.round(Number(recommendedDosage)) : (sum > 0 ? sum : 1);

      const suppData = {
        name,
        recommendedDosage: recVal,
        timingSchedule: { morning: mVal, afternoon: aVal, evening: eVal },
        image: state.newSuppImage
      };

      if (state.editingSuppId) {
        const index = state.supplements.findIndex(s => s.id === state.editingSuppId);
        if (index !== -1) state.supplements[index] = { ...state.supplements[index], ...suppData };
        showToast('情報を更新しました');
      } else {
        state.supplements.push({ id: Date.now().toString(), ...suppData });
        showToast('新しく登録しました');
      }
      cancelEdit();
      saveData();
      render();
    }

    function handleDeleteSupplement(id) {
      state.supplements = state.supplements.filter(s => s.id !== id);
      if (state.editingSuppId === id) cancelEdit();
      saveData();
      render();
      showToast('サプリを削除しました');
    }

    function saveHistory() { saveData(); showToast('既往歴を保存しました'); }
    function saveSettings() { saveData(); showToast('設定を保存しました'); }

    function getDayProgress(dateStr) {
      ensureDayLog(dateStr);
      const dayLogs = state.logs[dateStr];
      const timings = ['morning', 'afternoon', 'evening'];
      let scheduled = 0, completed = 0;
      
      timings.forEach(t => {
        let tScheduled = 0, tLogged = 0;
        state.supplements.forEach(supp => {
          if (supp.timingSchedule[t] > 0) {
            tScheduled++;
            if (dayLogs[t]?.[supp.id] > 0) tLogged++;
          }
        });
        scheduled += tScheduled;
        completed += tLogged;
      });
      return { hasPlan: scheduled > 0, isFullDone: scheduled > 0 && completed >= scheduled };
    }

    function getDayCounts(dateStr) {
      const logs = state.logs[dateStr] || {};
      let scheduled = 0, completed = 0;
      for (const timing of ['morning','afternoon','evening']) {
        for (const supp of state.supplements) {
          if ((supp.timingSchedule?.[timing] || 0) > 0) {
            scheduled++;
            if ((logs[timing]?.[supp.id] || 0) > 0) completed++;
          }
        }
      }
      return { scheduled, completed };
    }

    function renderCalendarHTML() {
      const year = state.calendarDate.getFullYear();
      const month = state.calendarDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = formatDate(new Date());
      const selectedCounts = getDayCounts(state.selectedDate);
      const isToday = state.selectedDate === todayStr;
      const percent = selectedCounts.scheduled ? Math.min(100,Math.round(selectedCounts.completed/selectedCounts.scheduled*100)) : 0;
      let html = `<section class="bg-gradient-to-br from-teal-900 to-emerald-800 text-white rounded-2xl p-4 sm:p-5 shadow-lg mb-4 border-2 border-teal-950">
        <div class="flex items-start justify-between gap-2">
          <div><div class="text-xs font-bold text-teal-100">選択日の服用チェック</div><div class="text-lg sm:text-xl font-black mt-1">${state.selectedDate.replace(/-/g,'/')} ${isToday?'・今日':''}</div></div>
          <button onclick="goToToday()" class="shrink-0 rounded-xl bg-white text-teal-900 px-3 py-2 border-2 border-white font-black text-xs shadow">今日に戻る</button>
        </div>
        <div class="flex justify-between items-end mt-3"><span class="text-sm font-bold">${selectedCounts.scheduled ? '記録済み / 予定' : '予定の登録はありません'}</span><span class="text-xl font-black">${selectedCounts.completed}<span class="text-sm"> / ${selectedCounts.scheduled} 件</span></span></div>
        <div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}" aria-label="記録進捗" class="mt-2 h-3 w-full rounded-full bg-teal-950/70 overflow-hidden border border-teal-500"><div style="width:${percent}%" class="h-full bg-yellow-300 rounded-full transition-all"></div></div>
      </section>`;
      html += `<section class="bg-white px-3 sm:px-4 py-4 rounded-2xl shadow-md border-2 border-slate-600 mb-4">
        <div class="flex justify-between items-center mb-4">
          <button aria-label="前の月" onclick="changeMonth(-1)" class="p-2.5 bg-slate-100 border-2 border-slate-400 text-slate-900 rounded-xl hover:bg-slate-200"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
          <div class="font-black text-xl text-teal-950 tracking-tight">${year}年 ${month + 1}月</div>
          <button aria-label="次の月" onclick="changeMonth(1)" class="p-2.5 bg-slate-100 border-2 border-slate-400 text-slate-900 rounded-xl hover:bg-slate-200"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
        </div>
        <div class="calendar-board" role="group" aria-label="服用記録カレンダー">`;
      ['日','月','火','水','木','金','土'].forEach((w,i) => { html += `<div class="calendar-weekday ${i===0?'!text-red-700':i===6?'!text-blue-700':''}">${w}</div>`; });
      for (let i=0;i<firstDay;i++) html += `<div class="calendar-blank" aria-hidden="true"></div>`;
      for (let i=1;i<=daysInMonth;i++) {
        const dateStr = formatDate(new Date(year, month, i));
        const isSelected = dateStr === state.selectedDate;
        const isCurrent = dateStr === todayStr;
        const counts = getDayCounts(dateStr);
        const done = counts.scheduled > 0 && counts.completed >= counts.scheduled;
        const progress = state.logs[dateStr] || {};
        const has = t => state.supplements.some(s => (progress[t]?.[s.id] || 0) > 0);
        const colors = ['morning','afternoon','evening'].map((t,ix) => has(t) ? ['#fbbf24','#38bdf8','#a5b4fc'][ix] : (isSelected ? '#99aab5' : '#cbd5e1'));
        html += `<button type="button" onclick="selectDate('${dateStr}')" aria-label="${year}年${month+1}月${i}日、${counts.completed}件記録済み" aria-pressed="${isSelected}" class="calendar-day ${isSelected?'is-selected':''} ${isCurrent?'is-today':''} ${done?'is-complete':''}">
          <span>${i}${done?'<span class="ml-0.5 text-xs" aria-hidden="true">✓</span>':''}</span>
          <span class="flex gap-1" aria-hidden="true">${colors.map(c=>`<span class="calendar-dot" style="background:${c}"></span>`).join('')}</span>
        </button>`;
      }
      const tail=(7-(firstDay+daysInMonth)%7)%7;
      for(let i=0;i<tail;i++) html += `<div class="calendar-blank" aria-hidden="true"></div>`;
      html += `</div><div class="flex flex-wrap gap-x-4 gap-y-2 mt-3 text-xs font-bold text-slate-700">
        <span><span class="inline-block w-2.5 h-2.5 bg-amber-400 rounded-full mr-1"></span>朝</span>
        <span><span class="inline-block w-2.5 h-2.5 bg-sky-400 rounded-full mr-1"></span>昼</span>
        <span><span class="inline-block w-2.5 h-2.5 bg-indigo-300 rounded-full mr-1"></span>夕</span>
        <span><span class="inline-block w-2.5 h-2.5 bg-slate-300 rounded-full mr-1"></span>未記録</span>
        <span class="text-teal-800">✓ 予定完了</span>
      </div></section>`;
      return html;
    }

            ${state.connectionResult ? (state.connectionResult.startsWith('接続OK') ? `<p class="mt-2 rounded-xl border-2 border-green-700 bg-green-50 p-3 text-sm font-bold text-green-950">${safeHtml(state.connectionResult)}</p>` : errorPanel(state.connectionResult,'GAS接続診断結果')) : ''}
            <p class="mt-2 text-xs font-bold text-slate-700">※診断で「接続OK」でも、Gemini APIキー・モデルの利用権限は別途確認が必要です。</p>
            <button onclick="saveSettings()" class="w-full mt-4 bg-slate-800 text-white font-black py-3 rounded-xl text-xs shadow-md border-2 border-slate-900 hover:bg-slate-900">設定を保存する</button>
          </div>`;
        }

        mainEl.innerHTML = html;
        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();

        if (state.activeTab === 'ai') {
          const chatArea = document.getElementById('ai-chat-area');
          if (chatArea) chatArea.scrollTop = chatArea.scrollHeight;
        }
      } catch (error) {
        document.getElementById('main-content').innerHTML = `
          <div class="p-5 text-red-700 bg-red-50 border-2 border-red-300 rounded-xl text-sm font-bold shadow-sm">
            <i data-lucide="alert-triangle" class="w-6 h-6 mb-2"></i>
            画面の描画に失敗しました。<br>エラー詳細: ${error.message}
          </div>`;
        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
        console.error("Render Error:", error);
      }
    }

    document.addEventListener("DOMContentLoaded", () => render());
  </script>
</body>
</html>
