<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>毎日のサプリ＆おくすり管理</title>
  <!-- v1.4 写真の下書き保存 / IndexedDB移行 / バックアップ・復元 -->
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes fadeInDown {
      from { opacity: 0; transform: translate(-50%, -20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
    .animate-fade-in-down {
      animation: fadeInDown 0.3s ease-out forwards;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* スクロールバーを隠さず、操作できる状態を保つ */
    :root { color-scheme: light; }
    html { scroll-behavior: smooth; }
    body { -webkit-tap-highlight-color: transparent; }
    button { touch-action: manipulation; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #0d9488; outline-offset: 2px; }
    .calendar-board { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); border:2px solid #64748b; border-radius:12px; overflow:hidden; background:#94a3b8; gap:1px; }
    .calendar-weekday { text-align:center; padding:9px 0; font-size:12px; font-weight:900; background:#e2e8f0; color:#334155; }
    .calendar-day { min-height:51px; background:#fff; color:#0f172a; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:5px; font-weight:800; font-size:15px; border:2px solid transparent; cursor:pointer; }
    .calendar-day.is-today { background:#ccfbf1; border-color:#0f766e; }
    .calendar-day.is-selected { background:#115e59; color:#fff; border-color:#042f2e; }
    .calendar-day.is-complete:not(.is-selected) { background:#ecfdf5; }
    .calendar-day:focus-visible { outline:3px solid #0284c7; outline-offset:-3px; }
    .calendar-dot { height:7px; width:7px; border-radius:50%; display:inline-block; }
    .calendar-blank { background:#f1f5f9; min-height:51px; }
    .section-heading { font-size:16px; font-weight:900; color:#0f172a; }
    @media(min-width:640px) { .calendar-day,.calendar-blank { min-height:66px; } }
    @media(max-width:370px) { .calendar-day,.calendar-blank { min-height:45px; } .calendar-day { font-size:13px; } }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-900 pb-28 pt-20 select-none">

  <!-- ヘッダー -->
  <header class="bg-gradient-to-r from-teal-700 via-teal-800 to-emerald-800 text-white p-4 shadow-lg fixed top-0 left-0 w-full z-30 flex items-center justify-between border-b-4 border-teal-900 px-4">
    <div class="flex items-center min-w-0">
      <i data-lucide="calendar-check-2" class="mr-2 h-6 w-6 sm:h-7 sm:w-7 shrink-0 text-yellow-300 drop-shadow-md"></i>
      <h1 class="text-sm sm:text-lg md:text-xl font-black tracking-wide leading-tight">毎日のサプリ＆おくすり管理</h1>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button type="button" onclick="goToToday()" aria-label="今日の記録へ" class="bg-teal-900/70 hover:bg-teal-950 px-2 sm:px-3 py-2 rounded-lg text-xs font-black cursor-pointer border border-teal-500 transition">今日へ</button>
      <button type="button" onclick="switchTab('settings'); window.scrollTo(0,0)" aria-label="設定画面を開く" title="GAS URL・接続設定" class="flex items-center justify-center w-10 h-10 bg-white/15 hover:bg-white/25 rounded-xl border-2 border-teal-300 text-white shadow-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-yellow-300">
        <i data-lucide="settings" class="w-6 h-6"></i>
      </button>
    </div>
  </header>

  <!-- メインコンテンツ領域 -->
  <main class="max-w-3xl mx-auto px-3 sm:px-5 py-4" id="main-content"></main>

  <!-- トースト通知 -->
  <div id="toast" class="hidden fixed top-24 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full shadow-2xl z-50 border-2 border-teal-400 font-black animate-fade-in-down whitespace-nowrap text-sm flex items-center gap-2">
    <i data-lucide="info" class="w-4 h-4 text-teal-400"></i>
    <span id="toast-msg"></span>
  </div>

  <!-- 下部ナビゲーション -->
  <nav class="fixed bottom-0 w-full bg-white border-t-2 border-slate-400 flex justify-around p-2 z-40 shadow-[0_-5px_20px_rgba(0,0,0,0.06)] pb-safe">
    <button onclick="switchTab('log')" id="nav-log" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-500">
      <i data-lucide="calendar-days" class="w-6 h-6 mb-1"></i>
      <span class="text-[11px] font-black tracking-tight">記録</span>
    </button>
    <button onclick="switchTab('manage')" id="nav-manage" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-500">
      <i data-lucide="pill" class="w-6 h-6 mb-1"></i>
      <span class="text-[11px] font-black tracking-tight">サプリ管理</span>
    </button>
    <button onclick="switchTab('history')" id="nav-history" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-500">
      <i data-lucide="clipboard-list" class="w-6 h-6 mb-1"></i>
      <span class="text-[11px] font-black tracking-tight">既往歴</span>
    </button>
    <button onclick="switchTab('ai')" id="nav-ai" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-500">
      <i data-lucide="bot-message-square" class="w-6 h-6 mb-1"></i>
      <span class="text-[11px] font-black tracking-tight">AI相談・分析</span>
    </button>
    <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex flex-col items-center flex-1 py-1 transition-all duration-200 text-slate-500">
      <i data-lucide="settings-2" class="w-6 h-6 mb-1"></i>
      <span class="text-[11px] font-black tracking-tight">設定</span>
    </button>
  </nav>

  <script>
    const formatDate = (date) => {
      const d = new Date(date);
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().split('T')[0];
    };
    
    function resizeImage(dataUrl, maxWidth = 500, maxHeight = 500) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
          } else {
            if (height > maxHeight) {
              width = Math.round((width * maxHeight) / height);
              height = maxHeight;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.onerror = () => reject(new Error('画像の読み込みに失敗しました'));
        img.src = dataUrl;
      });
    }

    // v1.4: 以前の localStorage データを読み取ったうえで、写真を含む本体を
    // IndexedDB に保存します。画像を消して容量不足を回避する旧処理は使用しません。
    const DB_NAME = 'supplement-care-storage';
    const DB_VERSION = 1;
    const SNAPSHOT_KEY = 'supplement_app_v2_snapshot';
    const FALLBACK_KEY = 'supplement_app_v2_text_backup';
    let storageDB = null;
    let saveQueue = Promise.resolve(true);
    let draftSaveTimer = null;
    let dataReady = false;

    function safeLocalGet(key) {
      try { return localStorage.getItem(key); } catch (err) { return null; }
    }
    function safeJsonParse(raw, fallback) {
      if (raw === null || raw === undefined) return fallback;
      try { return JSON.parse(raw); } catch (err) { console.warn('データ読み込み失敗:', err); return fallback; }
    }
    function normalizeSupplements(items) {
      if (!Array.isArray(items)) return [];
      return items.filter(x => x && typeof x === 'object').map((s, idx) => {
        const morning = Number(s.timingSchedule?.morning ?? (s.defaultDosage ? Math.ceil(s.defaultDosage / 2) : 1)) || 0;
        const afternoon = Number(s.timingSchedule?.afternoon ?? 0) || 0;
        const evening = Number(s.timingSchedule?.evening ?? (s.defaultDosage ? Math.floor(s.defaultDosage / 2) : 1)) || 0;
        return {
          ...s,
          id: String(s.id || `recovered-${idx}`),
          name: String(s.name || '名称未設定'),
          recommendedDosage: Math.max(0, Math.round(Number(s.recommendedDosage) || morning + afternoon + evening || 1)),
          timingSchedule: {morning:Math.max(0,Math.round(morning)), afternoon:Math.max(0,Math.round(afternoon)), evening:Math.max(0,Math.round(evening))},
          image: typeof s.image === 'string' ? s.image : null
        };
      });
    }
    function normalizeLogs(raw) {
      const output = {};
      if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return output;
      Object.keys(raw).forEach(date => {
        const day = raw[date];
        if (!day || typeof day !== 'object') return;
        if (day.morning || day.afternoon || day.evening) {
          output[date] = {morning:day.morning || {}, afternoon:day.afternoon || {}, evening:day.evening || {}};
        } else {
          output[date] = {morning:{...day}, afternoon:{}, evening:{}};
        }
      });
      return output;
    }
    function legacySnapshot() {
      // バージョンアップ前のキーを絶対に先に消さず、既存データを移行する。
      const suppsRaw = safeLocalGet('supplements');
      const logRaw = safeLocalGet('logs');
      const newer = safeJsonParse(safeLocalGet(SNAPSHOT_KEY), null);
      const textOnly = safeJsonParse(safeLocalGet(FALLBACK_KEY), null);
      if (newer && Array.isArray(newer.supplements)) return newer;
      if (suppsRaw !== null || logRaw !== null || safeLocalGet('medicalHistory') !== null) {
        return {
          supplements: safeJsonParse(suppsRaw, []),
          logs: safeJsonParse(logRaw, {}),
          medicalHistory: safeLocalGet('medicalHistory') || '',
          gasUrl: safeLocalGet('gasUrl') || ''
        };
      }
      if (textOnly && Array.isArray(textOnly.supplements)) return textOnly;
      return {supplements:[], logs:{}, medicalHistory:'', gasUrl:safeLocalGet('gasUrl') || ''};
    }
    const initial = legacySnapshot();
    const state = {
      activeTab:'log', activeTiming:'all', selectedDate:formatDate(new Date()), calendarDate:new Date(),
      supplements:normalizeSupplements(initial.supplements), logs:normalizeLogs(initial.logs),
      medicalHistory:initial.medicalHistory || '', gasUrl:initial.gasUrl || '',
      manageForm:{name:'',recommendedDosage:'',morning:'0',afternoon:'0',evening:'0'},
      editingSuppId:null, newSuppImage:null,
      isAnalyzing:false, aiLoading:false, aiError:'', photoError:'',
      connectionResult:'',checkingConnection:false,aiReport:'',aiChatHistory:[],
      aiQuestion:'',isAskingAI:false,
      storageStatus:'保存先を確認中', storageError:''
    };

    function applySnapshot(snapshot, restoreDraft=true) {
      if (!snapshot || !Array.isArray(snapshot.supplements) || !snapshot.logs || typeof snapshot.logs !== 'object') {
        throw new Error('データ形式が正しくありません。');
      }
      state.supplements = normalizeSupplements(snapshot.supplements);
      state.logs = normalizeLogs(snapshot.logs);
      state.medicalHistory = typeof snapshot.medicalHistory === 'string' ? snapshot.medicalHistory : '';
      state.gasUrl = typeof snapshot.gasUrl === 'string' ? snapshot.gasUrl : '';
      state.cloudRevision = Number(snapshot.cloudRevision) || 0;
      state.cloudEnabled = !!snapshot.cloudEnabled;
      if (restoreDraft) {
        state.manageForm = {...{name:'',recommendedDosage:'',morning:'0',afternoon:'0',evening:'0'}, ...(snapshot.draft?.manageForm || {})};
        state.newSuppImage = snapshot.draft?.image || null;
        state.editingSuppId = snapshot.draft?.editingSuppId || null;
        if (state.editingSuppId && !state.supplements.some(s => s.id === state.editingSuppId)) state.editingSuppId = null;
      }
    }
    function makeSnapshot() {
      return {
        schemaVersion:2, updatedAt:new Date().toISOString(),
        supplements:state.supplements.map(s => ({...s})),
        logs:JSON.parse(JSON.stringify(state.logs)),
        medicalHistory:state.medicalHistory, gasUrl:state.gasUrl,
        cloudRevision:state.cloudRevision || 0, cloudEnabled:!!state.cloudEnabled,
        draft:{manageForm:{...state.manageForm}, image:state.newSuppImage, editingSuppId:state.editingSuppId}
      };
    }
    function openDB() {
      return new Promise((resolve,reject) => {
        if (!('indexedDB' in window)) return reject(new Error('IndexedDBは利用できません'));
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          if (!db.objectStoreNames.contains('records')) db.createObjectStore('records');
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('IndexedDB初期化失敗'));
        request.onblocked = () => reject(new Error('別のタブがデータベースを使用中です'));
      });
    }
    function dbRead(key) {
      return new Promise((resolve,reject) => {
        const tx = storageDB.transaction('records','readonly');
        const req = tx.objectStore('records').get(key);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }
    function dbWrite(snapshot) {
      return new Promise((resolve,reject) => {
        const tx = storageDB.transaction('records','readwrite');
        const store = tx.objectStore('records');
        const request = store.get('current');
        request.onsuccess = () => {
          if (request.result) store.put(request.result,'previous');
          store.put(snapshot,'current');
        };
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error || new Error('IndexedDBへの保存に失敗'));
        tx.onabort = () => reject(tx.error || new Error('保存処理を中断'));
      });
    }
    async function initializeApp() {
      try {
        storageDB = await openDB();
        const record = await dbRead('current');
        if (record && Array.isArray(record.supplements)) {
          applySnapshot(record);
        } else {
          await dbWrite(makeSnapshot()); // 旧データを画像込みで初回移行
        }
        state.storageStatus = '保存先：この端末内（IndexedDB）';
      } catch (err) {
        console.warn('IndexedDB:',err);
        storageDB = null;
        state.storageStatus = '保存先：ブラウザ内の代替保存';
        state.storageError = '保護ストレージを利用できません。データのバックアップを取得してください。';
      }
      // 同期キーは写真/服用記録のバックアップとは別の保存先から復元する。
      // localStorageが消えていてもIndexedDBに残っていれば復元できる。
      await restoreCloudKey();
      dataReady = true;
      render();
    }
    async function writeSnapshot(snapshot) {
      let dbOK = false, localOK = false;
      if (storageDB) {
        try { await dbWrite(snapshot); dbOK = true; } catch (err) { console.error('IndexedDB保存失敗:',err); }
      }
      try {
        // 一括バックアップが書けた場合にのみ、従来キーへも互換保存する。
        // 容量不足では古い写真を null で上書きすることを絶対にしない。
        localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(snapshot));
        localOK = true;
        try {
          localStorage.setItem('supplements', JSON.stringify(snapshot.supplements));
          localStorage.setItem('logs', JSON.stringify(snapshot.logs));
          localStorage.setItem('medicalHistory', snapshot.medicalHistory);
          localStorage.setItem('gasUrl', snapshot.gasUrl);
        } catch (compatError) { console.warn('従来キーの互換保存:', compatError); }
      } catch (err) {
        console.warn('localStorage容量制限。写真の削除は行いません:', err);
        try {
          const compact = {...snapshot,
            supplements:snapshot.supplements.map(s => ({...s,image:null})),
            draft:{...snapshot.draft,image:null}};
          localStorage.setItem(FALLBACK_KEY, JSON.stringify(compact));
        } catch (ignore) {}
      }
      const ok = dbOK || localOK;
      if (!ok) {
        state.storageError = '保存できませんでした。画面を閉じる前にバックアップを取得してください。ブラウザの空き容量・プライベートモードを確認してください。';
        state.storageStatus = '保存エラー';
      } else {
        state.storageError = '';
        state.storageStatus = dbOK ? '保存先：この端末内（IndexedDB）' : '保存先：ブラウザ内の代替保存';
      }
      return ok;
    }
    function saveData() {
      if (!dataReady) return Promise.resolve(false);
      const snapshot = makeSnapshot();
      const result = saveQueue.catch(() => false).then(() => writeSnapshot(snapshot));
      saveQueue = result;
      return result;
    }
    function scheduleDraftSave() {
      clearTimeout(draftSaveTimer);
      draftSaveTimer = setTimeout(() => {saveData().then(ok => {if (!ok) showToast('下書きを保存できませんでした');});},500);
    }
    function resetDraft() {
      state.manageForm = {name:'',recommendedDosage:'',morning:'0',afternoon:'0',evening:'0'};
      state.newSuppImage = null;
      state.editingSuppId = null;
      state.photoError = '';
    }
    function downloadBackup() {
      const backup = {...makeSnapshot(), kind:'supplement-care-backup', exportedAt:new Date().toISOString()};
      const blob = new Blob([JSON.stringify(backup,null,2)],{type:'application/json;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `サプリおくすりバックアップ_${formatDate(new Date())}.json`;
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(url),30000);
      showToast('バックアップのダウンロードを開始しました。保存先を確認してください');
    }
    async function importBackup(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        if (file.size > 60 * 1024 * 1024) throw new Error('ファイルが大きすぎます（上限60MB）。');
        const backup = JSON.parse(await file.text());
        if (!backup || !Array.isArray(backup.supplements) || !backup.logs || typeof backup.logs !== 'object') {
          throw new Error('バックアップファイルの形式が違います。');
        }
        if (!confirm(`バックアップから${backup.supplements.length}件の登録を復元します。現在のデータは置き換わります。よろしいですか？`)) return;
        downloadBackup(); // 誤操作に備え、復元前のデータを先に書き出す
        const current = makeSnapshot();
        applySnapshot({...backup,cloudEnabled:false,cloudRevision:0});
        const ok = await saveData();
        if (!ok) {applySnapshot(current);throw new Error('保存に失敗しました。元のデータに戻しました。');}
        showToast('データを復元しました');
        render();
      } catch (error) { alert('復元できませんでした：' + error.message); }
      finally {event.target.value='';}
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = message;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    function switchTab(tabId) {
      state.activeTab = tabId;
      render();
    }

    function changeMonth(delta) {
      const d = new Date(state.calendarDate);
      // 31日から月移動しても翌々月へ飛ばないようにする
      state.calendarDate = new Date(d.getFullYear(), d.getMonth() + delta, 1);
      render();
    }

    function selectDate(dateStr) {
      state.selectedDate = dateStr;
      state.calendarDate = new Date(dateStr);
      render();
    }

    function goToToday() {
      state.selectedDate = formatDate(new Date());
      state.calendarDate = new Date();
      render();
    }

    function setFilterTiming(timing) {
      state.activeTiming = timing;
      render();
    }

    function ensureDayLog(dateStr) {
      if (!state.logs[dateStr]) state.logs[dateStr] = { morning: {}, afternoon: {}, evening: {} };
      if (!state.logs[dateStr].morning) state.logs[dateStr].morning = {};
      if (!state.logs[dateStr].afternoon) state.logs[dateStr].afternoon = {};
      if (!state.logs[dateStr].evening) state.logs[dateStr].evening = {};
    }

    async function handleToggleLog(suppId, timing) {
      ensureDayLog(state.selectedDate);
      const supp = state.supplements.find(s => s.id === suppId);
      if (!supp) return;

      const plannedAmount = supp.timingSchedule[timing] || 0;
      const currentLog = state.logs[state.selectedDate][timing][suppId];
      let newAmount;

      if (currentLog !== undefined && currentLog > 0) {
        delete state.logs[state.selectedDate][timing][suppId];
        newAmount = 0;
        showToast(`「${safeHtml(supp.name)}」を未記録に戻しました`);
      } else {
        newAmount = plannedAmount > 0 ? plannedAmount : 1;
        state.logs[state.selectedDate][timing][suppId] = newAmount;
        showToast(`「${safeHtml(supp.name)}」を ${newAmount}粒 記録しました`);
      }

      const localSaved = await saveData();
      render();
      if (!localSaved) { showToast('服用記録を保存できませんでした'); return; }
      scheduleCloudUpload();

      if (state.gasUrl) {
        try {
          fetch(state.gasUrl.trim().replace(/\/edit.*$/, '/exec'), {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'log', cloudKey:state.cloudKey.trim(), date: state.selectedDate, timing: timing,
              timingLabel: getTimingLabel(timing), suppId: supp.id, suppName: supp.name, amount: newAmount, unit: '粒'
            })
          });
        } catch (e) { console.error('GAS送信失敗:', e); }
      }
    }

    async function handleCustomDosageChange(suppId, timing, val) {
      ensureDayLog(state.selectedDate);
      const amount = Math.max(0, Math.round(Number(val) || 0));
      if (amount === 0) delete state.logs[state.selectedDate][timing][suppId];
      else state.logs[state.selectedDate][timing][suppId] = amount;
      const ok = await saveData();
      if (!ok) showToast('粒数を保存できませんでした');
      else scheduleCloudUpload();
      render();
    }

    function getTimingLabel(timing) {
      return timing === 'morning' ? '朝' : (timing === 'afternoon' ? '昼' : '夕・夜');
    }

    async function handleImageChange(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) return showToast('画像ファイルを選択してください');
      try {
        const dataUrl = await new Promise((resolve,reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('画像ファイルを読み込めませんでした'));
          reader.readAsDataURL(file);
        });
        // 縮小に失敗しても元の画像をできるだけ保持する。
        try { state.newSuppImage = await resizeImage(dataUrl, 500, 500); }
        catch (err) { state.newSuppImage = dataUrl; }
        state.photoError='';
        const ok = await saveData();
        if (!ok) state.photoError='写真の下書き保存に失敗しました。容量・ブラウザ設定を確認してください。';
        else showToast('写真を下書き保存しました。AI解析できなくても残ります');
        render();
      } catch(err) {state.photoError='画像の読み込みに失敗しました: ' + err.message;render();}
    }

    function safeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function normalizeGasUrl(raw) {
      let url = (raw || '').trim();
      if (/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/edit/.test(url)) url = url.replace(/\/edit.*$/, '/exec');
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[^\s/?]+\/exec(?:\?.*)?$/.test(url)) {
        throw new Error('GAS_URL: GASのWebアプリURLが正しくありません。デプロイ画面の「ウェブアプリ」URL（/execで終わるURL）を設定してください。');
      }
      return url;
    }

    function explainError(error) {
      const msg = error?.message || String(error);
      if (/Failed to fetch|NetworkError|Load failed|fetch failed|CORS/i.test(msg))
        return 'NETWORK: GASへの通信に失敗しました。GASをWebアプリとしてデプロイし、アクセスできるユーザーの設定と/execのURLを確認してください。ブラウザの接続制限でも発生します。詳細: ' + msg;
      return msg;
    }

    async function gasRequest(payload) {
      const url = normalizeGasUrl(state.gasUrl);
      if(payload.action === 'gemini' && state.cloudKey) payload={...payload,cloudKey:state.cloudKey.trim()};
      let response;
      try {
        response = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload)});
      } catch(error) { throw new Error(explainError(error)); }
      const raw = await response.text();
      if (!response.ok) throw new Error('HTTP_' + response.status + ': GAS応答エラー。アクセス権限・デプロイ設定を確認してください。');
      let result;
      try {result = JSON.parse(raw);} catch(e) {
        throw new Error('GAS_RESPONSE: GASからJSON以外の応答が届きました。ログイン画面・権限エラー・古いデプロイの可能性があります。応答冒頭: ' + raw.replace(/<[^>]*>/g,' ').slice(0,180));
      }
      if (result.status === 'error' || result.error) {
        const problem = result.message || result.error?.message || '不明なAPIエラー';
        throw new Error((result.code || 'GEMINI_ERROR') + ': ' + problem);
      }
      return result;
    }

    // v1.5.1: 同期キーはバックアップJSONとGitHubに含めず、端末内の
    // localStorage + IndexedDB にそれぞれ保存する。サイトデータ消去には耐えられない。
    const CLOUD_KEY_LOCAL = 'supplement_cloud_secret_v1'; // 旧版との互換
    const CLOUD_KEY_LOCAL_V2 = 'supplement_cloud_secret_v2';
    const CLOUD_KEY_DB_ID = 'cloudSecret';
    const VALID_CLOUD_KEY = /^[a-f0-9]{64}$/i;

    function parseCloudKeyRecord(raw) {
      if (!raw) return null;
      try {
        const record = typeof raw === 'string' ? JSON.parse(raw) : raw;
        if (record && VALID_CLOUD_KEY.test(String(record.key || ''))) {
          return {key:String(record.key).trim(),savedAt:Number(record.savedAt)||0};
        }
      } catch(ignore) {}
      return null;
    }
    function readLocalCloudKeyRecord() {
      const latest = parseCloudKeyRecord(safeLocalGet(CLOUD_KEY_LOCAL_V2));
      if (latest) return latest;
      const old = (safeLocalGet(CLOUD_KEY_LOCAL) || '').trim();
      return VALID_CLOUD_KEY.test(old) ? {key:old,savedAt:0} : null;
    }
    function dbSaveCloudKey(record) {
      return new Promise((resolve,reject) => {
        if (!storageDB) return reject(new Error('IndexedDBを開けません'));
        const tx = storageDB.transaction('records','readwrite');
        tx.objectStore('records').put(record,CLOUD_KEY_DB_ID);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error || new Error('IndexedDB保存失敗'));
        tx.onabort = () => reject(tx.error || new Error('IndexedDB保存中断'));
      });
    }

    state.cloudKey = readLocalCloudKeyRecord()?.key || '';
    state.cloudKeySaveStatus = state.cloudKey ? '以前の保存キーを確認中…' : '同期キーは未設定です';
    state.cloudEnabled = !!initial.cloudEnabled;
    state.cloudRevision = Number(initial.cloudRevision) || 0;
    state.cloudStatus = '';
    state.cloudError = '';
    state.cloudBusy = false;
    let cloudSyncTimer = null;
    let cloudInFlight = false;
    let cloudLocalChanges = 0;

    async function restoreCloudKey() {
      const local = readLocalCloudKeyRecord();
      let indexed = null;
      if (storageDB) {
        try { indexed = parseCloudKeyRecord(await dbRead(CLOUD_KEY_DB_ID)); }
        catch (e) { console.warn('同期キーのIndexedDB読込失敗（キーは表示しません）:',e?.name); }
      }
      // 日時付きの新しいキーを優先。旧版のキーは初回移行で読み込む。
      const selected = indexed && (!local || indexed.savedAt >= local.savedAt) ? indexed : local;
      state.cloudKey = selected?.key || '';
      if (!selected) {
        state.cloudKeySaveStatus = '未設定：64文字のキーを入力して保存してください';
        return;
      }
      const where = indexed?.key === selected.key ? '端末の保護ストレージ' : 'ブラウザの保存領域';
      state.cloudKeySaveStatus = '保存済みの同期キーを'+where+'から復元しました';
      // IndexedDB内に有効なキーがなければ、旧版のlocalStorageからコピーして保護する。
      if (storageDB && (!indexed || indexed.key !== selected.key)) {
        try { await dbSaveCloudKey(selected); }
        catch (e) { console.warn('同期キー移行に失敗（内容は表示しません）:',e?.name); }
      }
      // localStorageが消えていた場合は復元。再起動でも二重化を保つ。
      if (!local || local.key !== selected.key) {
        try {
          localStorage.setItem(CLOUD_KEY_LOCAL_V2,JSON.stringify(selected));
          localStorage.setItem(CLOUD_KEY_LOCAL,selected.key);
        } catch(ignore) {}
      }
    }

    async function rememberCloudKey() {
      const input = document.getElementById('sync-secret');
      const key = String(input ? input.value : state.cloudKey).trim();
      if (!VALID_CLOUD_KEY.test(key)) {
        state.cloudError = '同期キーはGASで発行した64文字の英数字（16進数）を入力してください。';
        state.cloudKeySaveStatus = '保存していません（入力内容を確認してください）';
        render();return;
      }
      state.cloudKey = key;
      state.cloudError = '';
      const record = {key,savedAt:Date.now()};
      let localOk=false, dbOk=false;
      try {
        localStorage.setItem(CLOUD_KEY_LOCAL_V2,JSON.stringify(record));
        localStorage.setItem(CLOUD_KEY_LOCAL,key);
        localOk = readLocalCloudKeyRecord()?.key === key;
      } catch(e) {console.warn('同期キーlocalStorage保存失敗:',e?.name);}
      if (storageDB) {
        try {
          await dbSaveCloudKey(record);
          dbOk = parseCloudKeyRecord(await dbRead(CLOUD_KEY_DB_ID))?.key === key;
        } catch(e) {console.warn('同期キーIndexedDB保存失敗:',e?.name);}
      }
      if (localOk && dbOk) {
        state.cloudKeySaveStatus = '保存確認済み：ブラウザ＋保護ストレージ（2か所）';
        showToast('同期キーを2か所に保存しました');
      } else if (localOk || dbOk) {
        state.cloudKeySaveStatus = '一部のみ保存：スマホを閉じた後は再確認が必要';
        state.cloudError = '同期キーを一方の保存領域にしか保存できませんでした。ブラウザのプライベートモード・サイトデータ自動削除設定をご確認ください。';
      } else {
        state.cloudKeySaveStatus = '保存失敗：この画面を閉じるとキーが消える可能性があります';
        state.cloudError = 'このブラウザでは同期キーを端末に保存できません。Chromeの通常タブでGitHub PagesのURLを直接開いて再度お試しください。';
      }
      render();
    }
    function cloudRequest(action,extra={}) {
      const key = state.cloudKey.trim();
      if(!/^[a-f0-9]{64}$/i.test(key)) throw new Error('同期キーは、GASでsetupCloudSync()を実行した際に表示された64文字のキーです。');
      return gasRequest({action,cloudKey:key,...extra});
    }
    async function checkCloudStatus() {
      state.cloudBusy=true;state.cloudError='';state.cloudStatus='';render();
      try {
        const r=await cloudRequest('cloudStatus');
        state.cloudStatus=r.hasCloudData ? `Google側にデータがあります（改訂${r.revision}、${r.updatedAt}）。この端末は改訂${state.cloudRevision}です。` : 'Google側はまだ空です。まず「Googleに保存」を押してください。';
      } catch(e) {state.cloudError=explainError(e);}
      finally {state.cloudBusy=false;render();}
    }
    function scheduleCloudUpload() {
      if (!state.cloudEnabled || !state.cloudKey || !state.gasUrl) return;
      cloudLocalChanges++;
      clearTimeout(cloudSyncTimer);
      cloudSyncTimer=setTimeout(()=>pushCloudData(false),1800);
    }
    async function pushCloudData(manual=true) {
      if(cloudInFlight) {
        if(manual) showToast('同期処理中です。完了をお待ちください');
        else {clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(()=>pushCloudData(false),2500);}
        return;
      }
      cloudInFlight=true;
      state.cloudBusy=true;state.cloudError='';if(manual)state.cloudStatus='';
      render();
      const seq=cloudLocalChanges;
      try {
        await saveQueue;
        // 下書きは端末のみ。登録済みの写真・服用記録・既往歴をGoogleに保存する。
        const data=makeSnapshot();
        const r=await cloudRequest('cloudPush',{expectedRevision:state.cloudRevision,snapshot:{supplements:data.supplements,logs:data.logs,medicalHistory:data.medicalHistory}});
        state.cloudRevision=Number(r.revision);
        state.cloudEnabled=true;
        try {localStorage.setItem(CLOUD_KEY_LOCAL,state.cloudKey.trim());} catch(ignore) {}
        await saveData();
        state.cloudStatus=`Google保存成功：改訂${r.revision}（画像${r.photoUploads}件、登録変更${r.supplementChanges}件、服用変更${r.changedLogs}件）`;
        if(manual)showToast('Google Drive・スプレッドシートへ保存しました');
      } catch(e) {
        state.cloudError='端末内のデータは残っています。Googleへの保存は未完了です。'+explainError(e);
      } finally {
        state.cloudBusy=false;cloudInFlight=false;render();
        if(!state.cloudError && seq!==cloudLocalChanges) {
          clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(()=>pushCloudData(false),1800);
        }
      }
    }
    function meaningfulItem_(item) {
      return JSON.stringify([item.name,item.recommendedDosage,item.timingSchedule,item.image||null]);
    }
    function mergeCloudSnapshot_(local,remote) {
      const merged={...local,supplements:normalizeSupplements(local.supplements),logs:normalizeLogs(local.logs)};
      const byId=new Map(merged.supplements.map(s=>[s.id,s]));
      const mapId={};let conflicts=0,added=0;
      const remoteById=new Map((remote.supplements||[]).map(s=>[s.id,s]));
      function cloudClone(id) {
        if(mapId[id] && mapId[id]!==id) return mapId[id];
        const r=remoteById.get(id);
        if(!r) return id;
        const cloneId='cloud_'+String(id).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,70)+'_'+Date.now().toString(36);
        merged.supplements.push({...r,id:cloneId,name:String(r.name||'名称未設定')+'（クラウド版・要確認）'});
        byId.set(cloneId,merged.supplements[merged.supplements.length-1]);
        mapId[id]=cloneId;conflicts++;
        return cloneId;
      }
      for(const r of remote.supplements||[]) {
        const l=byId.get(r.id);
        if(!l){merged.supplements.push(r);byId.set(r.id,r);mapId[r.id]=r.id;added++;}
        else if(meaningfulItem_(l)===meaningfulItem_(r)){mapId[r.id]=r.id;}
        else if(!l.image && r.image && JSON.stringify([l.name,l.recommendedDosage,l.timingSchedule])===JSON.stringify([r.name,r.recommendedDosage,r.timingSchedule])){
          l.image=r.image;mapId[r.id]=r.id;
        }
        else cloudClone(r.id);
      }
      for(const [date,day] of Object.entries(remote.logs||{})) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date))continue;
        if(!merged.logs[date])merged.logs[date]={morning:{},afternoon:{},evening:{}};
        for(const timing of ['morning','afternoon','evening']) {
          merged.logs[date][timing] ||= {};
          for(const [id,amount] of Object.entries(day[timing]||{})) {
            let target=mapId[id]||id;
            if(!byId.has(target)) continue;
            if (merged.logs[date][timing][target]!==undefined && Number(merged.logs[date][timing][target])!==Number(amount)) {
              target=cloudClone(id);
            }
            if(merged.logs[date][timing][target]===undefined)merged.logs[date][timing][target]=amount;
          }
        }
      }
      const a=String(merged.medicalHistory||'').trim(), b=String(remote.medicalHistory||'').trim();
      if(b && a!==b) merged.medicalHistory = a ? a+'\n\n【クラウドから復元した既往歴・要確認】\n'+b : b;
      return {merged,conflicts,added};
    }
    async function pullCloudData() {
      if(!confirm('クラウドから取り込みます。現在の端末データは先にJSONでバックアップし、消さずに統合します。続けますか？')) return;
      state.cloudBusy=true;state.cloudError='';state.cloudStatus='';render();
      try {
        const r=await cloudRequest('cloudPull');
        if(!r.hasCloudData)throw new Error('Google側には保存済みのデータがありません。');
        await saveQueue;
        downloadBackup();  // 取り込み前に必ずローカル退避
        const old=makeSnapshot();
        const result=mergeCloudSnapshot_(old,r.snapshot);
        applySnapshot({...result.merged,gasUrl:state.gasUrl,cloudRevision:r.revision,cloudEnabled:true});
        const ok=await saveData();
        if(!ok){applySnapshot(old);throw new Error('端末へ保存できませんでした。元のデータに戻しました。');}
        state.cloudStatus=`クラウドから取り込み完了：追加${result.added}件、内容違い${result.conflicts}件（内容違いは別名で両方保持）。取り込み前データをダウンロード済み。`;
      } catch(e){state.cloudError=explainError(e);}
      finally{state.cloudBusy=false;render();}
    }

    function errorPanel(message, heading='AI通信エラー') {
      if (!message) return '';
      return `<div role="alert" class="mt-3 bg-red-50 border-2 border-red-600 text-red-950 p-4 rounded-xl shadow-sm">
        <p class="text-base font-black mb-2">⚠ ${safeHtml(heading)}</p>
        <p class="text-sm font-semibold leading-relaxed whitespace-pre-wrap break-words select-text">${safeHtml(message)}</p>
        <p class="text-xs font-bold mt-2">※ APIキーやパスワードを共有しないでください。</p>
      </div>`;
    }

    async function checkGasConnection() {
      state.checkingConnection = true;
      state.connectionResult = '';
      render();
      try {
        const url = normalizeGasUrl(state.gasUrl);
        const response = await fetch(url, {method:'GET'});
        const body = await response.text();
        if (!response.ok) throw new Error('HTTP_' + response.status + ': Webアプリへのアクセスが拒否されました。');
        if (!body.includes('毎日のサプリ管理GASサーバーは正常に稼働しています')) {
          throw new Error('GAS_RESPONSE: 想定したGASの応答ではありません。ウェブアプリのデプロイ先やアクセス権限を確認してください。');
        }
        state.connectionResult = '接続OK：GASの公開URLへアクセスできました。ただしGemini APIへの接続は別途確認が必要です。';
      } catch(e) {state.connectionResult = explainError(e);}
      finally {state.checkingConnection = false; render();}
    }

    async function handleAnalyzeImage() {
      if (!state.gasUrl) { state.photoError='GAS_URL: 設定画面でGAS WebアプリURLを登録してください。'; render(); return; }
      if (!state.newSuppImage) return showToast('写真を選択してください');
      
      state.photoError = '';
      state.isAnalyzing = true;
      render();

      try {
        const match = state.newSuppImage.match(/^data:(image\/[a-zA-Z+]+);base64,(.+)$/);
        if (!match) throw new Error('画像フォーマット不正');
        
        const result = await gasRequest({
            action: 'gemini', model: 'gemini-3.6-flash',
            payload: {
              contents: [{role:'user', parts:[
                {text:'このサプリ・薬のパッケージ画像から「製品名(name)」「1日の合計推奨量(recommendedDosage)」「朝(morning), 昼(afternoon), 夕/夜(evening)ごとの目安粒数」を抽出し、JSON形式で返答してください。単位はすべて整数です。読み取れない内容は推測せず空にしてください。'},
                {inlineData:{mimeType:match[1], data:match[2]}}
              ]}], generationConfig:{responseMimeType:'application/json'}
            }
        });
        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error('EMPTY_RESPONSE: Geminiから解析結果が返りませんでした。画像内容・API応答を確認してください。');
        if (text) {
          const parsed = JSON.parse(text);
          if (parsed.name) state.manageForm.name = parsed.name;
          if (parsed.recommendedDosage) state.manageForm.recommendedDosage = String(Math.round(parsed.recommendedDosage));
          state.manageForm.morning = String(parsed.morning !== undefined ? Math.round(parsed.morning) : 1);
          state.manageForm.afternoon = String(parsed.afternoon !== undefined ? Math.round(parsed.afternoon) : 0);
          state.manageForm.evening = String(parsed.evening !== undefined ? Math.round(parsed.evening) : 1);
          showToast('AIが解析・自動入力しました！');
        }
      } catch (e) {
        state.photoError = explainError(e) + '\n※写真はそのまま残っています。名前を手入力して「登録」するか、写真だけ仮登録できます。';
      } finally {
        state.isAnalyzing = false;
        await saveData(); // 失敗でも写真付きの下書きを維持
        render();
      }
    }

    function getAIReadableSupplements() {
      // 写真のBase64本体を文章分析へ誤送信しない。画像解析ボタンでは別途画像を送信する。
      return state.supplements.map(s => ({
        id:s.id, name:s.name, recommendedDosage:s.recommendedDosage,
        timingSchedule:s.timingSchedule, hasImage:!!s.image
      }));
    }

    async function handleGenerateAIReport() {
      if (!state.gasUrl) return showToast('設定からGAS URLを設定してください');
      state.aiLoading = true;
      state.aiReport = '';
      render();

      try {
        const parts = [{ 
          text: `あなたはプロのアドバイザーです。以下のデータをもとに週間レビューを作成してください。\n既往歴: ${state.medicalHistory || "なし"}\nサプリ: ${JSON.stringify(getAIReadableSupplements())}\n最近のログ: ${JSON.stringify(state.logs)}`
        }];

        const response = await fetch(state.gasUrl.trim().replace(/\/edit.*$/, '/exec'), {
          method: 'POST', headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'gemini',
            model: 'gemini-3.6-flash',
            payload: { contents: [{ role: 'user', parts }] }
          })
        });

        const raw = await response.text();
        if (!response.ok) throw new Error('HTTP_' + response.status + ': GASのアクセス設定を確認してください。');
        let result;
        try { result = JSON.parse(raw); } catch(e) { throw new Error('GAS_RESPONSE: JSON以外の応答です。アクセス権限かデプロイURLを確認してください。'); }
        if (result.status === 'error') throw new Error(result.message);
        state.aiReport = result.candidates?.[0]?.content?.parts?.[0]?.text || '生成失敗';
      } catch (e) {
        state.aiReport = 'エラー: ' + e.message;
      } finally {
        state.aiLoading = false;
        render();
      }
    }

    async function handleAskAI() {
      if (!state.gasUrl) return showToast('設定画面からGAS URLを設定してください');
      if (!state.aiQuestion.trim()) return;

      const question = state.aiQuestion;
      state.aiQuestion = '';
      state.isAskingAI = true;
      state.aiChatHistory.push({ role: 'user', text: question });
      render();

      try {
        const prompt = `あなたはプロのヘルスケアアドバイザーです。既往歴「${state.medicalHistory || "特になし"}」、登録サプリ「${JSON.stringify(getAIReadableSupplements())}」、服薬ログ「${JSON.stringify(state.logs)}」を踏まえて、次の質問に答えてください。\n\n質問: ${question}`;
        const response = await fetch(state.gasUrl.trim().replace(/\/edit.*$/, '/exec'), {
          method: 'POST', headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'gemini',
            model: 'gemini-3.6-flash',
            payload: { contents: [{ role: "user", parts: [{ text: prompt }] }] }
          })
        });
        const raw = await response.text();
        if (!response.ok) throw new Error('HTTP_' + response.status + ': GASのアクセス設定を確認してください。');
        let result;
        try { result = JSON.parse(raw); } catch(e) { throw new Error('GAS_RESPONSE: JSON以外の応答です。アクセス権限かデプロイURLを確認してください。'); }
        if (result.status === 'error') throw new Error(result.message);
        const answer = result.candidates?.[0]?.content?.parts?.[0]?.text || '回答エラー';
        state.aiChatHistory.push({ role: 'model', text: answer });
      } catch (e) {
        state.aiChatHistory.push({ role: 'model', text: 'エラーが発生しました: ' + e.message });
      } finally {
        state.isAskingAI = false;
        render();
      }
    }

    function startEdit(id) {
      const supp = state.supplements.find(s => s.id === id);
      if (!supp) return;
      state.manageForm.name = supp.name;
      state.manageForm.recommendedDosage = String(supp.recommendedDosage || 0);
      state.manageForm.morning = String(supp.timingSchedule?.morning ?? 0);
      state.manageForm.afternoon = String(supp.timingSchedule?.afternoon ?? 0);
      state.manageForm.evening = String(supp.timingSchedule?.evening ?? 0);
      state.newSuppImage = supp.image;
      state.editingSuppId = id;
      state.photoError = '';
      scheduleDraftSave();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    async function cancelEdit() {
      resetDraft();
      const ok = await saveData();
      render();
      if (!ok) showToast('下書きの変更を保存できませんでした');
    }

    async function handleSaveSupplement(event) {
      event.preventDefault();
      const { name, recommendedDosage, morning, afternoon, evening } = state.manageForm;
      if (!name.trim() && !state.newSuppImage) return showToast('名前または写真を入力してください');
      const photoOnly = !name.trim() && !!state.newSuppImage;
      const finalName = photoOnly ? '写真のみ登録（未解析）' : name.trim();
      const mVal = photoOnly ? 0 : Math.max(0, Math.round(Number(morning) || 0));
      const aVal = photoOnly ? 0 : Math.max(0, Math.round(Number(afternoon) || 0));
      const eVal = photoOnly ? 0 : Math.max(0, Math.round(Number(evening) || 0));
      const sum = mVal + aVal + eVal;
      const recVal = photoOnly ? 0 : (recommendedDosage ? Math.max(0,Math.round(Number(recommendedDosage)||0)) : sum);
      const prevSnapshot = makeSnapshot();
      const suppData = {
        name:finalName,
        recommendedDosage:recVal,
        timingSchedule:{morning:mVal,afternoon:aVal,evening:eVal},
        image:state.newSuppImage // AIが失敗しても写真を必ず使う
      };
      let nextSupplements = state.supplements.map(s => ({...s}));
      if (state.editingSuppId) {
        const index = nextSupplements.findIndex(s => s.id === state.editingSuppId);
        if (index < 0) return showToast('編集対象のデータが見つかりません');
        nextSupplements[index] = {...nextSupplements[index],...suppData};
      } else {
        nextSupplements.push({id:Date.now().toString()+'-'+Math.random().toString(36).slice(2,7),...suppData});
      }
      state.supplements = nextSupplements;
      const editing = !!state.editingSuppId;
      resetDraft();
      clearTimeout(draftSaveTimer);
      const ok = await saveData();
      if (!ok) {
        applySnapshot(prevSnapshot);
        render();
        return showToast('保存できませんでした。写真と入力内容は画面に残しています');
      }
      scheduleCloudUpload();
      render();
      showToast(photoOnly ? '写真だけ仮登録しました。後から名前・数量を編集できます' : editing ? '写真と登録内容を更新しました' : '写真と登録内容を保存しました');
    }

    async function handleDeleteSupplement(id) {
      const supp = state.supplements.find(s => s.id === id);
      if (!supp || !confirm(`「${safeHtml(supp.name)}」を削除しますか？（復元にはバックアップが必要です）`)) return;
      const prevSnapshot = makeSnapshot();
      state.supplements = state.supplements.filter(s => s.id !== id);
      if (state.editingSuppId === id) resetDraft();
      const ok = await saveData();
      if (!ok) {applySnapshot(prevSnapshot);showToast('削除結果を保存できませんでした');}
      else {showToast('登録を削除しました');scheduleCloudUpload();}
      render();
    }

    async function saveHistory() {const ok=await saveData();if(ok)scheduleCloudUpload();showToast(ok?'既往歴を保存しました':'保存できませんでした');}
    async function saveSettings() {const ok=await saveData();showToast(ok?'設定を保存しました':'保存できませんでした');}

    function getDayProgress(dateStr) {
      ensureDayLog(dateStr);
      const dayLogs = state.logs[dateStr];
      const timings = ['morning', 'afternoon', 'evening'];
      let scheduled = 0, completed = 0;
      
      timings.forEach(t => {
        let tScheduled = 0, tLogged = 0;
        state.supplements.forEach(supp => {
          if (supp.timingSchedule[t] > 0) {
            tScheduled++;
            if (dayLogs[t]?.[supp.id] > 0) tLogged++;
          }
        });
        scheduled += tScheduled;
        completed += tLogged;
      });
      return { hasPlan: scheduled > 0, isFullDone: scheduled > 0 && completed >= scheduled };
    }

    function getDayCounts(dateStr) {
      const logs = state.logs[dateStr] || {};
      let scheduled = 0, completed = 0;
      for (const timing of ['morning','afternoon','evening']) {
        for (const supp of state.supplements) {
          if ((supp.timingSchedule?.[timing] || 0) > 0) {
            scheduled++;
            if ((logs[timing]?.[supp.id] || 0) > 0) completed++;
          }
        }
      }
      return { scheduled, completed };
    }

    function renderCalendarHTML() {
      const year = state.calendarDate.getFullYear();
      const month = state.calendarDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = formatDate(new Date());
      const selectedCounts = getDayCounts(state.selectedDate);
      const isToday = state.selectedDate === todayStr;
      const percent = selectedCounts.scheduled ? Math.min(100,Math.round(selectedCounts.completed/selectedCounts.scheduled*100)) : 0;
      let html = `<section class="bg-gradient-to-br from-teal-900 to-emerald-800 text-white rounded-2xl p-4 sm:p-5 shadow-lg mb-4 border-2 border-teal-950">

          <button onclick="goToToday()" class="shrink-0 rounded-xl bg-white text-teal-900 px-3 py-2 border-2 border-white font-black text-xs shadow">今日に戻る</button>

        <div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${percent}" aria-label="記録進捗" class="mt-2 h-3 w-full rounded-full bg-teal-950/70 overflow-hidden border border-teal-500"><div style="width:${percent}%" class="h-full bg-yellow-300 rounded-full transition-all"></div></div>
      </section>`;
      html += `<section class="bg-white px-3 sm:px-4 py-4 rounded-2xl shadow-md border-2 border-slate-600 mb-4">
        <div class="flex justify-between items-center mb-4">
          <button aria-label="前の月" onclick="changeMonth(-1)" class="p-2.5 bg-slate-100 border-2 border-slate-400 text-slate-900 rounded-xl hover:bg-slate-200"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
          <div class="font-black text-xl text-teal-950 tracking-tight">${year}年 ${month + 1}月</div>
          <button aria-label="次の月" onclick="changeMonth(1)" class="p-2.5 bg-slate-100 border-2 border-slate-400 text-slate-900 rounded-xl hover:bg-slate-200"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
        </div>
        <div class="calendar-board" role="group" aria-label="服用記録カレンダー">`;
      ['日','月','火','水','木','金','土'].forEach((w,i) => { html += `<div class="calendar-weekday ${i===0?'!text-red-700':i===6?'!text-blue-700':''}">${w}</div>`; });
      for (let i=0;i<firstDay;i++) html += `<div class="calendar-blank" aria-hidden="true"></div>`;
      for (let i=1;i<=daysInMonth;i++) {
        const dateStr = formatDate(new Date(year, month, i));
        const isSelected = dateStr === state.selectedDate;
        const isCurrent = dateStr === todayStr;
        const counts = getDayCounts(dateStr);
        const done = counts.scheduled > 0 && counts.completed >= counts.scheduled;
        const progress = state.logs[dateStr] || {};
        const has = t => state.supplements.some(s => (progress[t]?.[s.id] || 0) > 0);
        const colors = ['morning','afternoon','evening'].map((t,ix) => has(t) ? ['#fbbf24','#38bdf8','#a5b4fc'][ix] : (isSelected ? '#99aab5' : '#cbd5e1'));
        html += `<button type="button" onclick="selectDate('${dateStr}')" aria-label="${year}年${month+1}月${i}日、${counts.completed}件記録済み" aria-pressed="${isSelected}" class="calendar-day ${isSelected?'is-selected':''} ${isCurrent?'is-today':''} ${done?'is-complete':''}">
          <span>${i}${done?'<span class="ml-0.5 text-xs" aria-hidden="true">✓</span>':''}</span>
          <span class="flex gap-1" aria-hidden="true">${colors.map(c=>`<span class="calendar-dot" style="background:${c}"></span>`).join('')}</span>
        </button>`;
      }
      const tail=(7-(firstDay+daysInMonth)%7)%7;
      for(let i=0;i<tail;i++) html += `<div class="calendar-blank" aria-hidden="true"></div>`;
      html += `</div><div class="flex flex-wrap gap-x-4 gap-y-2 mt-3 text-xs font-bold text-slate-700">
        <span><span class="inline-block w-2.5 h-2.5 bg-amber-400 rounded-full mr-1"></span>朝</span>
        <span><span class="inline-block w-2.5 h-2.5 bg-sky-400 rounded-full mr-1"></span>昼</span>
        <span><span class="inline-block w-2.5 h-2.5 bg-indigo-300 rounded-full mr-1"></span>夕</span>
        <span><span class="inline-block w-2.5 h-2.5 bg-slate-300 rounded-full mr-1"></span>未記録</span>
        <span class="text-teal-800">✓ 予定完了</span>
      </div></section>`;
      return html;
    }

              <div class="flex gap-2 mt-auto">
                <input type="text" value="${state.aiQuestion}" oninput="state.aiQuestion=this.value" onkeydown="if(event.key==='Enter')handleAskAI()" placeholder="質問を入力..." class="flex-grow p-2.5 border-2 border-slate-400 rounded-xl font-bold text-xs outline-none focus:border-indigo-500 bg-slate-50 focus:bg-white" />
                <button onclick="handleAskAI()" ${state.isAskingAI ? 'disabled' : ''} class="bg-indigo-700 text-white px-4 rounded-xl shadow-sm border-2 border-indigo-900 hover:bg-indigo-800 disabled:opacity-50 disabled:cursor-not-allowed"><i data-lucide="send" class="w-4 h-4"></i></button>
              </div>
            </div>
          </div>`;
        } else if (state.activeTab === 'settings') {
          html += `<div class="bg-white p-5 rounded-2xl shadow-sm border-2 border-slate-400">
            <h2 class="text-base font-black mb-3 text-slate-900"><i data-lucide="settings-2" class="inline w-4 h-4 mr-2"></i>外部連携設定</h2>
            <div class="p-3 border-2 border-teal-300 bg-teal-50 rounded-xl">
              <label class="font-black block mb-2 text-xs text-teal-900">GAS WebアプリURL</label>
              <input type="text" value="${safeHtml(state.gasUrl)}" oninput="state.gasUrl=this.value" class="w-full p-2.5 border-2 border-teal-400 rounded-xl font-bold text-xs outline-none focus:border-teal-600 bg-white" />
            </div>
            <button onclick="checkGasConnection()" ${state.checkingConnection ? 'disabled' : ''} class="w-full mt-3 bg-teal-800 text-white font-black py-3 rounded-xl text-sm border-2 border-teal-950">${state.checkingConnection ? '診断中…' : 'GAS接続を診断する'}</button>
            ${state.connectionResult ? (state.connectionResult.startsWith('接続OK') ? `<p class="mt-2 rounded-xl border-2 border-green-700 bg-green-50 p-3 text-sm font-bold text-green-950">${safeHtml(state.connectionResult)}</p>` : errorPanel(state.connectionResult,'GAS接続診断結果')) : ''}
            <p class="mt-2 text-xs font-bold text-slate-700">※診断で「接続OK」でも、Gemini APIキー・モデルの利用権限は別途確認が必要です。</p>
            <button onclick="saveSettings()" class="w-full mt-4 bg-slate-800 text-white font-black py-3 rounded-xl text-xs shadow-md border-2 border-slate-900 hover:bg-slate-900">設定を保存する</button>
          </div>
          <section class="bg-white p-5 rounded-2xl shadow-sm border-2 border-teal-700 mt-4">
            <h2 class="text-lg font-black text-teal-950 mb-2">☁ Google Drive・スプレッドシート同期</h2>
            <p class="text-sm text-slate-800 font-bold leading-relaxed mb-3">登録した写真は非公開のDriveへ、サプリ台帳・服用履歴・既往歴はスプレッドシートへ変更履歴を残します。初回はバックアップ後に手動保存してください。その後は登録・服用変更時に自動同期します。</p>
            <label for="sync-secret" class="block text-sm font-black text-slate-900 mb-1">同期キー（GASで setupCloudSync を実行して取得）</label>
            <input id="sync-secret" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="64文字の同期キー" value="${safeHtml(state.cloudKey)}" oninput="state.cloudKey=this.value;state.cloudKeySaveStatus='入力内容は未保存です（下の保存ボタンを押してください）'" class="w-full p-3 rounded-xl border-2 border-slate-500 text-base text-slate-900 bg-white" />
            <button type="button" onclick="rememberCloudKey()" class="mt-2 w-full p-3 border-2 border-teal-700 text-teal-950 bg-teal-50 rounded-xl font-black text-sm">同期キーを端末に保存</button>
            <p class="mt-2 p-3 rounded-xl bg-slate-100 text-slate-900 border border-slate-500 text-sm font-bold" role="status">🔐 ${safeHtml(state.cloudKeySaveStatus)}</p>
            <p class="mt-1 text-xs font-bold text-slate-700">端末内の2か所に保存します。GitHubやデータバックアップにはキーを含めません。スマホのサイトデータが消える設定やプライベートモードでは保持されない場合があります。</p>
            <div class="grid grid-cols-2 gap-2 mt-3">
              <button type="button" onclick="checkCloudStatus()" ${state.cloudBusy?'disabled':''} class="p-3 rounded-xl bg-slate-100 text-slate-900 border-2 border-slate-500 text-sm font-black disabled:opacity-50">クラウド状態を確認</button>
              <button type="button" onclick="pushCloudData(true)" ${state.cloudBusy?'disabled':''} class="p-3 rounded-xl bg-teal-800 text-white border-2 border-teal-950 text-sm font-black disabled:opacity-50">Googleに保存</button>
            </div>
            <button type="button" onclick="pullCloudData()" ${state.cloudBusy?'disabled':''} class="w-full mt-2 p-3 bg-white border-2 border-indigo-800 text-indigo-900 rounded-xl font-black text-sm disabled:opacity-50">クラウドから取り込む（消さずに統合）</button>
            <div class="mt-3 rounded-xl bg-slate-100 border border-slate-400 p-3 text-sm font-bold text-slate-800">
              ${state.cloudBusy ? '処理中…' : state.cloudEnabled ? '自動同期：有効（端末内の保存は継続）' : '自動同期：未開始（最初に「Googleに保存」を実行）'}
              <div class="mt-1 text-xs">この端末の改訂：${state.cloudRevision}</div>
            </div>
            ${state.cloudStatus ? `<p class="mt-2 text-sm text-teal-950 font-bold border-2 border-teal-600 bg-teal-50 p-3 rounded-xl" role="status">${safeHtml(state.cloudStatus)}</p>` : ''}
            ${state.cloudError ? errorPanel(state.cloudError,'クラウド同期エラー') : ''}
            <p class="mt-3 text-xs font-bold text-red-800">同期キーはGitHubやチャットに貼らないでください。クラウドへ保存される情報には健康・既往歴データが含まれます。AI解析失敗後の下書き写真は「登録」するまで端末内のみです。</p>
          </section>
          <section class="bg-white p-5 rounded-2xl shadow-sm border-2 border-slate-600 mt-4">
            <h2 class="text-lg font-black text-slate-900 mb-2">🛡 登録データ・写真の保護</h2>
            <p class="text-sm text-slate-800 font-bold mb-2">${safeHtml(state.storageStatus)}</p>
            ${state.storageError ? errorPanel(state.storageError,'保存機能の注意') : ''}
            <p class="text-sm text-slate-700 leading-relaxed mb-3">写真・登録内容・服用履歴は、この端末にも保存されます。クラウド同期を有効にすると登録済みデータはGoogle側にも保存されますが、通信失敗時は手動で再送が必要です。</p>
            <button type="button" onclick="downloadBackup()" class="w-full bg-teal-800 text-white rounded-xl p-3 border-2 border-teal-950 text-base font-black">バックアップをダウンロード</button>
            <label class="mt-3 w-full flex justify-center cursor-pointer bg-white text-teal-900 border-2 border-teal-700 rounded-xl p-3 font-black text-sm"><input class="hidden" type="file" accept="application/json,.json" onchange="importBackup(event)">バックアップから復元</label>
            <p class="text-xs font-bold text-red-800 mt-3">バックアップには写真・服用履歴・既往歴などの個人情報が含まれます。ファイルを安全に保管してください。</p>
          </section>`;
        }

        if (state.storageError && state.activeTab !== 'settings') {
          html = `<div role="alert" class="mb-3 p-3 rounded-xl border-2 border-red-600 bg-red-50 text-red-950 font-bold">⚠ ${safeHtml(state.storageError)}</div>` + html;
        }
        mainEl.innerHTML = html;
        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();

        if (state.activeTab === 'ai') {
          const chatArea = document.getElementById('ai-chat-area');
          if (chatArea) chatArea.scrollTop = chatArea.scrollHeight;
        }
      } catch (error) {
        document.getElementById('main-content').innerHTML = `
          <div class="p-5 text-red-700 bg-red-50 border-2 border-red-300 rounded-xl text-sm font-bold shadow-sm">
            <i data-lucide="alert-triangle" class="w-6 h-6 mb-2"></i>
            画面の描画に失敗しました。<br>エラー詳細: ${error.message}
          </div>`;
        if (typeof lucide !== 'undefined' && lucide.createIcons) lucide.createIcons();
        console.error("Render Error:", error);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('main-content').innerHTML = '<div class="p-5 bg-white rounded-xl border-2 border-teal-700 font-black text-slate-800">保存済みデータを確認しています…</div>';
      initializeApp();
    });
  </script>
</body>
</html>
