x}.pill-item .row{flex-wrap:wrap;justify-content:flex-start}@media(max-width:420px){.calendar-grid{gap:3px}.calendar-day{min-height:57px;font-size:.8rem}.calendar-blank{min-height:57px}.calendar-dot{width:6px;height:6px}.pill-photo{width:52px;height:52px;flex-basis:52px}}

<body>
<header class="header"><div class="header-inner"><div class="brand-icon" aria-hidden="true">🗓️</div><div class="brand">ビタミン・サプリ管理<div class="v">シンプル版 v2.3・写真AI＋カレンダー</div></div><button class="today" data-action="today">今日へ</button></div></header>
<main><div id="notice" aria-live="polite"></div><div id="content"></div></main>
<nav class="tabs" aria-label="メニュー">
<button class="tab active" data-tab="record"><b>🗓️</b>記録</button>
<button class="tab" data-tab="manage"><b>💊</b>サプリ管理</button>
<button class="tab" data-tab="history"><b>📋</b>履歴</button>
<button class="tab" data-tab="settings"><b>⚙️</b>設定</button>
</nav>
<script>
'use strict';
// GASのURLをこの定数へ設定すれば、ブラウザの保存データ削除後も再入力不要です。
// 設定画面から登録するだけでも使用できます。
const DEFAULT_GAS_URL = '';
const URL_KEY = 'supp_simple_gas_url';
function oldGasUrl(){
 const direct=safeStorageGet('gasUrl');if(direct)return direct;
 try {const x=JSON.parse(safeStorageGet('supplement_app_v2_snapshot')||'null');return x?.gasUrl||'';}catch(e){return '';}
}
const PENDING_KEY = 'supp_simple_pending';
const VERSION = '2.3.0';
const TIMES = [{id:'morning',name:'朝',symbol:'☀️'},{id:'afternoon',name:'昼',symbol:'🌤️'},{id:'evening',name:'夜',symbol:'🌙'}];
const app={tab:'record',date:todayDate(),gasUrl:DEFAULT_GAS_URL||safeStorageGet(URL_KEY)||oldGasUrl()||'',supplements:[],logs:{},loaded:false,busy:false,message:'',kind:'',editing:null,historyRows:0,spreadsheet:'',pending:null,aiConfigured:false,ai:{dataUrl:'',saveDataUrl:'',previewName:'',analyzing:false,error:'',result:null},draft:null,photoRemove:false,photoCache:{},photoErrors:{},photoLoading:{},calendarMonth:todayDate().slice(0,7)};
function todayDate(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
function safeStorageGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function safeStorageSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function safeStorageDelete(k){try{localStorage.removeItem(k);}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function validateUrl(raw){let s=String(raw||'').trim();s=s.replace(/\/edit(?:\?.*)?$/,'/exec');if(!/^https:\/\/script\.google\.com\/macros\/s\/[-\w]+\/exec(?:\?.*)?$/.test(s))throw new Error('GASのURL（https://script.google.com/macros/s/.../exec）を入力してください。');return s;}
function alertMsg(message,kind='warn'){app.message=message;app.kind=kind;paintNotice();}
function paintNotice(){const el=document.getElementById('notice');el.innerHTML=app.message?`<div class="notice ${esc(app.kind)}" role="status">${esc(app.message)}</div>`:'';}
function setBusy(x){app.busy=!!x;render();}
function newId(prefix){const rnd=window.crypto?.randomUUID?.()||('t'+Date.now().toString(36)+Math.random().toString(36).slice(2));return prefix+String(rnd).replace(/[^a-zA-Z0-9_-]/g,'');}
function jsonp(action,params={},timeout=17000){return new Promise((resolve,reject)=>{
  const cb='suppCb_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2);let done=false;
  const s=document.createElement('script');s.async=true;
  const finish=(err,data)=>{if(done)return;done=true;clearTimeout(timer);s.remove();delete window[cb];err?reject(err):resolve(data);};
  window[cb]=result=>finish(null,result);
  const timer=setTimeout(()=>finish(new Error('応答がありません。GASのデプロイ設定やURLを確認してください。')),timeout);
  s.onerror=()=>finish(new Error('GASを読み込めません。公開設定・URL・ネット接続を確認してください。'));
  const url=new URL(validateUrl(app.gasUrl));url.searchParams.set('action',action);url.searchParams.set('callback',cb);url.searchParams.set('_',Date.now());
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));s.src=url.toString();document.head.appendChild(s);
});}
async function readState(silent=false){
  if(!app.gasUrl){app.loaded=false;render();return;}
  app.busy=true;render();
  try{
    const r=await jsonp('state');
    if(!r?.ok || r.version!==VERSION || !Array.isArray(r.supplements))throw new Error(r?.error||'GASがv2.3ではありません。付属のCode.gsを貼り、既存のデプロイを「新バージョン」で更新してください。');
    app.supplements=r.supplements;app.logs=r.logs||{};app.loaded=true;app.spreadsheet=r.spreadsheet||'';app.historyRows=Number(r.historyRows||0);app.aiConfigured=!!r.aiConfigured;
    if(!silent)alertMsg('Googleスプレッドシートから読み込みました。','good');
    return true;
  }catch(e){app.loaded=false;alertMsg(e.message,'error');return false;}
  finally{app.busy=false;render();}
}
async function verifyWrite(id){
  for(let i=0;i<4;i++){
    await new Promise(r=>setTimeout(r,i===0?300:1200));
    try{const r=await jsonp('ack',{requestId:id},13000);if(r?.ok && r.found)return true;}catch(e){}
  }
  return false;
}
async function saveAction(payload){
  if(!app.gasUrl){app.tab='settings';alertMsg('先に設定画面へGASのURLを入力してください。','warn');render();return false;}
  if(app.busy)return false;
  const event={...payload,requestId:newId('req_')};
  // 端末内の保存が使えない場合でも、Googleへの書き込みは妨げません。
  safeStorageSet(PENDING_KEY,JSON.stringify(event));
  return sendEvent(event);
}
async function sendEvent(event){
  setBusy(true);alertMsg('Googleスプレッドシートへ送信し、保存完了を確認しています…','warn');
  let sendError='';
  try{
    // Google Apps Scriptは別ドメインにリダイレクトするため、POSTはno-corsで送信。
    // 送っただけでは成功扱いせず、下のJSONP確認で実際の保存結果をチェックします。
    const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),20000);
    try{await fetch(validateUrl(app.gasUrl),{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(event),signal:ctrl.signal});}
    finally{clearTimeout(timer);}
  }catch(e){sendError=e?.message||'送信時に通信エラーが発生しました';}
  const ok=await verifyWrite(event.requestId);
  if(ok){
    safeStorageDelete(PENDING_KEY);app.pending=null;
    setBusy(false);
    const refreshed=await readState(true);
    alertMsg(refreshed?'スプレッドシートに保存できました。':'保存は確認できました。表示更新に失敗したため「再読込」を押してください。',refreshed?'good':'warn');
    return true;
  }
  app.pending=event;setBusy(false);
  alertMsg('保存を確認できませんでした。'+(sendError?'（'+sendError+'）':'')+' 設定画面の「未確認の送信を再試行」を押してください。','error');
  return false;
}
async function retryPending(){if(!app.pending||app.busy)return;await sendEvent(app.pending);}
async function saveGasUrl(e){e.preventDefault();const input=document.getElementById('gas-url');try{
  const value=validateUrl(input.value);
  if(app.pending && app.gasUrl && app.gasUrl!==value && !confirm('未確認の送信が残っています。別のGASへ切り替えますか？'))return;
  app.gasUrl=value;safeStorageSet(URL_KEY,value);app.pending=null;safeStorageDelete(PENDING_KEY);app.loaded=false;
  await readState();
}catch(e){alertMsg(e.message,'error');}}
function activeSupps(){return app.supplements.filter(s=>!s.deleted);}
function countRecorded(date){const o=app.logs[date]||{};let n=0;TIMES.forEach(t=>{Object.values(o[t.id]||{}).forEach(v=>{if(Number(v)>0)n++;});});return n;}
function dayLog(date,t,id){return Math.max(0,Number(app.logs[date]?.[t]?.[id]||0));}
// 写真はGAS経由でDriveから読み込み、画面に表示します。端末内の画像保存には依存しません。
function photoPlaceholder(id,size=''){
 const safe=esc(id||'');
 return `<span class="pill-photo ${size}"><img data-photo-id="${safe}" alt="サプリの写真" hidden><span class="pic-placeholder" aria-hidden="true">💊</span></span>`;
}
function hydratePhotos(){
 if(!app.gasUrl||!app.loaded)return;
 const imgs=Array.from(document.querySelectorAll('img[data-photo-id]'));
 const ids=[...new Set(imgs.map(el=>el.dataset.photoId).filter(Boolean))];
 for(const id of ids){
   if(app.photoCache[id]){imgs.filter(el=>el.dataset.photoId===id).forEach(el=>{
     el.src=app.photoCache[id];el.hidden=false;if(el.nextElementSibling)el.nextElementSibling.hidden=true;
   });continue;}
   if(app.photoErrors[id]||app.photoLoading[id])continue;
   if(Object.keys(app.photoLoading).length>=3)break;
   app.photoLoading[id]=true;
   jsonp('photo',{fileId:id},28000).then(r=>{
     if(!r?.ok||!r.dataUrl||!r.dataUrl.startsWith('data:image/'))throw new Error(r?.error||'写真を読み込めません');
     app.photoCache[id]=r.dataUrl;
     document.querySelectorAll('img[data-photo-id]').forEach(el=>{
       if(el.dataset.photoId!==id)return;
       el.src=r.dataUrl;el.hidden=false;if(el.nextElementSibling)el.nextElementSibling.hidden=true;
     });
   }).catch(e=>{app.photoErrors[id]=true;console.warn('写真読込:',e.message);})
    .finally(()=>{delete app.photoLoading[id];hydratePhotos();});
 }
}
function calendarStats(date){
 const day=app.logs[date]||{},sups=activeSupps();let planned=0,completed=0;
 const present={};
 TIMES.forEach(t=>{
   present[t.id]=Object.values(day[t.id]||{}).some(n=>Number(n)>0);
   sups.forEach(s=>{if(Number(s[t.id])>0){planned++;if(dayLog(date,t.id,s.id)>0)completed++;}});
 });
 return {planned,completed,present,complete:planned>0&&completed>=planned};
}
function renderCalendar(){
 const [year,month]=app.calendarMonth.split('-').map(Number),first=new Date(year,month-1,1).getDay();
 const days=new Date(year,month,0).getDate();let out=`<section class="card teal"><div class="calendar-title"><button class="arrow" data-action="month-prev" aria-label="前の月">‹</button><strong>${year}年${month}月</strong><button class="arrow" data-action="month-next" aria-label="次の月">›</button></div><div class="calendar-grid" role="group" aria-label="服用記録カレンダー">`;
 ['日','月','火','水','木','金','土'].forEach((day,i)=>{out+=`<span class="calendar-weekday ${i===0?'sun':i===6?'sat':''}">${day}</span>`;});
 for(let i=0;i<first;i++)out+='<span class="calendar-blank" aria-hidden="true"></span>';
 for(let i=1;i<=days;i++){
  const date=[year,String(month).padStart(2,'0'),String(i).padStart(2,'0')].join('-'),s=calendarStats(date);
  out+=`<button class="calendar-day ${date===app.date?'is-selected':''} ${date===todayDate()?'is-today':''} ${s.complete?'is-complete':''}" aria-pressed="${date===app.date}" data-action="calendar-select" data-date="${date}" aria-label="${month}月${i}日、服用記録${countRecorded(date)}件"><span class="day-number">${i}</span><span class="calendar-dots">${TIMES.map(t=>`<span class="calendar-dot ${t.id} ${s.present[t.id]?'on':''}"></span>`).join('')}</span></button>`;
 }
 out+='</div><div class="calendar-legend"><span><i class="legend-dot" style="background:#d59c11"></i>朝</span><span><i class="legend-dot" style="background:#138ac7"></i>昼</span><span><i class="legend-dot" style="background:#cf4b54"></i>夜</span><span>✓ 予定分の記録完了</span></div><p class="small muted">日付をタップすると、その日の服用記録に切り替わります。</p></section>';
 return out;
}
function shiftMonth(delta){const [y,m]=app.calendarMonth.split('-').map(Number),d=new Date(y,m-1+delta,1,12);app.calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render();}
function renderRecord(){if(!app.loaded)return `<section class="card teal"><h2>服用記録</h2><div class="empty">Googleスプレッドシートに接続すると、日々の服用を記録できます。</div><button class="btn full" data-tab="settings">GASのURLを設定する</button></section>`;
const active=activeSupps();
let html=renderCalendar()+`<section class="card teal"><div class="date-selector"><button class="arrow" data-action="day-prev" aria-label="前日">‹</button><input class="input date" type="date" id="record-date" value="${esc(app.date)}" aria-label="記録の日付"><button class="arrow" data-action="day-next" aria-label="翌日">›</button></div><p class="small muted bold" style="text-align:center">日付を選び、服用したサプリを記録</p><div class="total">この日の服用記録：${countRecorded(app.date)}件</div></section>`;
if(!active.length)return html+`<section class="card"><h2>サプリが未登録です</h2><p>まず名前と朝・昼・夜の目安を登録してください。</p><button class="btn full" data-tab="manage">サプリを登録する</button></section>`;
TIMES.forEach(t=>{
 html+=`<section class="card"><h2>${t.symbol} ${t.name}の記録</h2>`;

async function choosePhoto(file){
 if(!file)return;
 captureDraft();app.ai.error='';app.ai.result=null;app.ai.dataUrl='';app.ai.saveDataUrl='';app.ai.previewName='';app.photoRemove=false;
 if(!file.type.startsWith('image/')){app.ai.error='画像ファイルを選んでください（JPEG/PNG推奨）。';render();return;}
 if(file.size>20*1024*1024){app.ai.error='元の写真が20MBを超えています。小さめの写真を選んでください。';render();return;}
 try{
  const img=await new Promise((resolve,reject)=>{const im=new Image();const url=URL.createObjectURL(file);im.onload=()=>{URL.revokeObjectURL(url);resolve(im)};im.onerror=()=>{URL.revokeObjectURL(url);reject(Error('この画像形式を開けません。JPEG/PNGで撮影してください。'))};im.src=url;});
  const max=1400,ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*ratio));c.height=Math.max(1,Math.round(img.naturalHeight*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let data=c.toDataURL('image/jpeg',.78);if(data.length>1000000)data=c.toDataURL('image/jpeg',.55);
  if(data.length>1000000)throw Error('画像を縮小できませんでした。写真を撮り直してください。');
  // Drive保存用は表示専用の軽量画像。AI用の高解像度画像とは分離する。
  const sm=Math.min(1,760/Math.max(img.naturalWidth,img.naturalHeight)),sc=document.createElement('canvas');
  sc.width=Math.max(1,Math.round(img.naturalWidth*sm));sc.height=Math.max(1,Math.round(img.naturalHeight*sm));
  sc.getContext('2d').drawImage(img,0,0,sc.width,sc.height);
  let small=sc.toDataURL('image/jpeg',.72);
  if(small.length>450000)small=sc.toDataURL('image/jpeg',.48);
  if(small.length>650000)throw Error('画像を縮小できませんでした。別の写真を選んでください。');
  app.ai.dataUrl=data;app.ai.saveDataUrl=small;app.ai.previewName=file.name;render();
 }catch(err){app.ai.error=err.message||'画像の読み込みに失敗しました。';render();}
}
async function analyzePhoto(){
 if(app.ai.analyzing||app.busy)return;
 if(!app.ai.dataUrl){app.ai.error='先に写真を選んでください。';render();return;}
 if(!app.gasUrl){app.tab='settings';alertMsg('先にGAS URLを設定してください。','warn');render();return;}
 captureDraft();app.ai.analyzing=true;app.ai.error='';app.ai.result=null;render();
 const requestId=newId('img_');
 try{
  const body=JSON.stringify({action:'analyzeImage',requestId,imageData:app.ai.dataUrl});
  // doPostの応答はGoogleのリダイレクトで読めない。GET(JSONP)で解析結果を安全に取得する。
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),75000);
  const post=fetch(validateUrl(app.gasUrl),{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body,signal:ctrl.signal}).catch(()=>null).finally(()=>clearTimeout(timer));
  let result=null;
  const deadline=Date.now()+90000;
  while(Date.now()<deadline){
   await new Promise(r=>setTimeout(r,1800));
   try{const r=await jsonp('aiResult',{requestId},12000);
    if(r?.ok && r.status==='done'){result=r.result;break;}
    if(r?.status==='error'||(r?.ok===false&&r.error)){const ex=Error(r.error||'写真解析でエラーが発生しました。');ex.isAIError=true;throw ex;}

   }catch(err){if(err.isAIError)throw err;/* 一時的なJSONP通信失敗は次のポーリングで再試行 */}
  }
  if(!result)throw Error('解析結果の受信がタイムアウトしました。電波状態やGASのデプロイ、APIキー設定をご確認ください。');
  app.ai.result=result;
  if(!app.draft)app.draft=supplementDraft();
  if(result.name)app.draft.name=result.name;
  app.draft.aiIngredients=result.ingredients||'';app.draft.aiServing=result.serving||'';app.draft.aiSummary=result.summary||'';app.draft.aiCautions=result.cautions||'';
  for(const [field,target] of [['morning','morning'],['afternoon','afternoon'],['evening','evening']]){if(Number.isInteger(result.schedule?.[field]))app.draft[target]=result.schedule[field];}
  alertMsg('写真を解析しました。サプリ名や服用目安を確認し、下の「サプリを登録」を押してください。','good');
  void post;
 }catch(err){app.ai.error=err.message||'解析できませんでした。GAS設定をご確認ください。';}
 finally{app.ai.analyzing=false;render();}
}
